[project]
name = "api"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.16.5",
    "argon2-cffi>=25.1.0",
    "authlib>=1.6.5",
    "async-lru>=2.0.5",
    "asyncpg>=0.30.0",
    "beautifulsoup4>=4.14.2",
    "cos-python-sdk-v5>=1.9.38",
    "minio>=7.2.15",
    "cryptography>=44.0.0",
    "docker>=7.1.0",
    "fastapi>=0.130.0",
    "httpx>=0.28.1",
    # itsdangerous has no direct import; it is a runtime requirement of
    # starlette.middleware.sessions.SessionMiddleware used in app/main.py
    "itsdangerous>=2.2.0",
    "json-repair>=0.53.0",
    "openai>=1.107.2",
    "pillow>=11.0.0",
    "pypdf>=5.0.0",
    "psycopg2-binary>=2.9.10",
    "pydantic>=2.12.5",
    "pydantic-settings>=2.12.0",
    "pyjwt>=2.10.1",
    "python-multipart>=0.0.32",
    "redis>=6.4.0",
    "sse-starlette>=3.0.3",
    "sqlalchemy>=2.0.43",
    "uvicorn[standard]>=0.38.0",
    "prometheus-client>=0.21.0",
    "opentelemetry-api>=1.29.0",
    "opentelemetry-sdk>=1.29.0",
    "opentelemetry-exporter-otlp-proto-grpc>=1.29.0",
    "opentelemetry-instrumentation-fastapi>=0.50b0",
    "pymupdf>=1.27.2.3",
    "pgvector>=0.3.6",
    "python-docx>=1.2.0",
    "weasyprint>=63.0",
    "psutil>=6.1.0",
]

[project.optional-dependencies]
k8s = [
    "kubernetes>=31.0.0",
]

[dependency-groups]
dev = [
    "httpx2>=2.12.0,<3",
    "hypothesis>=6.165.10",
    "import-linter>=2.13",
    "pytest>=8.4.2",
    "pytest-asyncio>=1.0.0",
    "ruff>=0.16.3",
]
execution-kernel = [
    "playwright>=1.56.0",
    "jieba>=0.42.1",
    "python-pptx>=1.0.2",
    "openpyxl>=3.1.5",
    "markdownify>=1.2.2",
    "mcp>=1.22.0,<3",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.importlinter]
root_package = "app"

[[tool.importlinter.contracts]]
name = "domain must not import application"
type = "forbidden"
source_modules = ["app.domain"]
forbidden_modules = ["app.application"]

[[tool.importlinter.contracts]]
name = "domain must not import infrastructure"
type = "forbidden"
source_modules = ["app.domain"]
forbidden_modules = ["app.infrastructure"]

[[tool.importlinter.contracts]]
name = "application must not import interfaces"
type = "forbidden"
source_modules = ["app.application"]
forbidden_modules = ["app.interfaces"]

[[tool.importlinter.contracts]]
name = "application must not import infrastructure"
type = "forbidden"
source_modules = ["app.application"]
forbidden_modules = ["app.infrastructure"]

[[tool.importlinter.contracts]]
name = "interfaces must not import infrastructure"
type = "forbidden"
source_modules = ["app.interfaces"]
forbidden_modules = ["app.infrastructure"]
allow_indirect_imports = true

[[tool.importlinter.contracts]]
name = "execution domain is isolated from upper layers"
type = "forbidden"
source_modules = ["app.domain.execution.**"]
forbidden_modules = ["app.application", "app.infrastructure", "app.interfaces"]

[[tool.importlinter.contracts]]
name = "execution projectors cannot invoke activities"
type = "forbidden"
source_modules = ["app.application.execution.formal_projector"]
forbidden_modules = [
    "app.application.execution.activity_registry",
    "app.application.execution.activities",
]
