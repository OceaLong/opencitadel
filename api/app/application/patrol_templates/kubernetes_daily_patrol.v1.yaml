schema_version: 1
target_ref: opencitadel-local
timezone: Asia/Shanghai
schedule:
  cron: "0 9 * * *"
  enabled: false
scope:
  cluster: opencitadel-demo
  namespaces: [opencitadel]
  environment: staging
defaults:
  timeout_seconds: 30
  max_evidence_items: 10
checks:
  - id: k8s-workload-availability
    title: Kubernetes workload availability
    probe:
      tool: k8s_workload_summary
      args: {namespace: opencitadel}
      output_schema_hash: 03af4b9122da051ecb5e5d707552f27b09875d46b1124b671bb350fad06b28e1
    assertions:
      - {id: no-unavailable-replicas, field: $.unavailable_replicas, op: eq, value: 0, status_on_failure: fail, message: Workload has unavailable replicas}
      - {id: all-workloads-ready, field: $.not_ready_workloads, op: empty, status_on_failure: fail, message: Workload is not ready}
    severity_on_fail: critical
    required_evidence: [summary, resource_refs]
    runbook_ref: kb://ops/runbooks/k8s-workload-unavailable
  - id: k8s-restart-spike
    title: Container restart spike
    probe:
      tool: k8s_workload_summary
      args: {namespace: opencitadel, window_seconds: 3600}
      output_schema_hash: 03af4b9122da051ecb5e5d707552f27b09875d46b1124b671bb350fad06b28e1
    assertions:
      - {id: restart-warning-threshold, field: $.restart_count_1h, op: lte, value: 3, status_on_failure: warn, message: More than 3 restarts in one hour}
      - {id: restart-critical-threshold, field: $.restart_count_1h, op: lte, value: 10, status_on_failure: fail, message: More than 10 restarts in one hour}
    severity_on_fail: critical
    required_evidence: [summary, resource_refs]
  - id: k8s-pending-failed
    title: Pending Pods and failed Jobs
    probe:
      tool: k8s_workload_summary
      args: {namespace: opencitadel}
      output_schema_hash: 03af4b9122da051ecb5e5d707552f27b09875d46b1124b671bb350fad06b28e1
    assertions:
      - {id: no-pending-pods, field: $.pending_pods, op: empty, status_on_failure: fail, message: Pending Pods exist}
      - {id: no-failed-jobs, field: $.failed_jobs, op: empty, status_on_failure: fail, message: Failed Jobs exist}
      - {id: no-stale-cronjobs, field: $.stale_cronjobs, op: empty, status_on_failure: fail, message: CronJob has no recent success}
    severity_on_fail: critical
    required_evidence: [summary, resource_refs]
  - id: k8s-warning-events
    title: High-risk Kubernetes warning events
    probe:
      tool: k8s_recent_events
      args: {namespace: opencitadel, since_seconds: 86400, limit: 200}
      output_schema_hash: 03af4b9122da051ecb5e5d707552f27b09875d46b1124b671bb350fad06b28e1
    assertions:
      - {id: no-high-risk-events, field: $.high_risk_count, op: eq, value: 0, status_on_failure: fail, message: High-risk warning events exist}
    severity_on_fail: critical
    required_evidence: [summary, resource_refs]
  - id: k8s-resource-pressure
    title: Node and PVC resource pressure
    probe:
      tool: k8s_workload_summary
      args: {namespace: opencitadel, pvc_query_id: pvc-utilization}
      output_schema_hash: 03af4b9122da051ecb5e5d707552f27b09875d46b1124b671bb350fad06b28e1
    assertions:
      - {id: no-node-pressure, field: $.node_pressures, op: empty, status_on_failure: fail, message: Node pressure exists}
      - {id: pvc-warning-threshold, field: $.max_pvc_utilization_percent, op: lt, value: 80.0, status_on_failure: warn, message: PVC utilization is at least 80 percent}
      - {id: pvc-critical-threshold, field: $.max_pvc_utilization_percent, op: lt, value: 90.0, status_on_failure: fail, message: PVC utilization is at least 90 percent}
    severity_on_fail: critical
    required_evidence: [summary, resource_refs, metric_sample]
  - id: app-error-rate
    title: Application HTTP 5xx ratio
    probe:
      tool: prom_query
      args: {query_id: app-5xx-ratio, window_seconds: 300}
      output_schema_hash: 03af4b9122da051ecb5e5d707552f27b09875d46b1124b671bb350fad06b28e1
    assertions:
      - {id: error-rate-warning, field: $.value, op: lt, value: 0.01, status_on_failure: warn, message: 5xx ratio is at least 1 percent}
      - {id: error-rate-critical, field: $.value, op: lt, value: 0.05, status_on_failure: fail, message: 5xx ratio is at least 5 percent}
    severity_on_fail: critical
    required_evidence: [metric_sample]
  - id: tls-expiry
    title: TLS certificate expiry
    probe:
      tool: certificate_status
      args: {probe_id: primary-tls}
      output_schema_hash: 03af4b9122da051ecb5e5d707552f27b09875d46b1124b671bb350fad06b28e1
    assertions:
      - {id: tls-warning, field: $.days_remaining, op: gte, value: 30, status_on_failure: warn, message: Certificate expires within 30 days}
      - {id: tls-critical, field: $.days_remaining, op: gte, value: 7, status_on_failure: fail, message: Certificate expires within 7 days}
    severity_on_fail: critical
    required_evidence: [tls_chain]
  - id: backup-freshness
    title: Backup freshness
    probe:
      tool: backup_status
      args: {backup_id: primary-database}
      output_schema_hash: 03af4b9122da051ecb5e5d707552f27b09875d46b1124b671bb350fad06b28e1
    assertions:
      - {id: backup-warning, field: $.age_hours, op: lte, value: 24.0, status_on_failure: warn, message: Backup is older than 24 hours}
      - {id: backup-critical, field: $.age_hours, op: lte, value: 48.0, status_on_failure: fail, message: Backup is older than 48 hours}
    severity_on_fail: critical
    required_evidence: [backup_metadata]
  - id: dependency-health
    title: PostgreSQL Redis and MinIO health
    probe:
      tool: dependency_status
      args: {dependency_id: primary-dependencies}
      output_schema_hash: 03af4b9122da051ecb5e5d707552f27b09875d46b1124b671bb350fad06b28e1
    assertions:
      - {id: all-dependencies-healthy, field: $.healthy, op: eq, value: true, status_on_failure: fail, message: A critical dependency is unavailable}
    severity_on_fail: critical
    required_evidence: [summary]
  - id: endpoint-health
    title: Critical endpoint health
    probe:
      tool: http_probe
      args: {probe_id: primary-endpoint}
      output_schema_hash: 03af4b9122da051ecb5e5d707552f27b09875d46b1124b671bb350fad06b28e1
    assertions:
      - {id: endpoint-success, field: $.healthy, op: eq, value: true, status_on_failure: fail, message: Endpoint returned a non-success status}
      - {id: endpoint-latency, field: $.latency_ms, op: lt, value: 2000, status_on_failure: warn, message: Endpoint latency is at least two seconds}
    severity_on_fail: critical
    required_evidence: [summary]
