{{- if and .Values.opsActuator.enabled .Values.opsActuator.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "opencitadel.fullname" . }}-ops-actuator
{{- /*
  Namespaced Role/RoleBinding per allowed namespace instead of a cluster-wide
  ClusterRole. Every resource the Actuator patches (deployments, statefulsets,
  replicasets) is namespaced, so the write grant is scoped exactly to the
  namespaces the operator registered in opsActuator.allowedNamespaces. The
  ServiceAccount can never patch workloads outside that set.
*/}}
{{- range $ns := .Values.opsActuator.allowedNamespaces }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "opencitadel.fullname" $ }}-ops-actuator-write
  namespace: {{ $ns }}
rules:
  - apiGroups: ["apps"]
    resources: ["deployments", "statefulsets"]
    verbs: ["get", "list", "watch", "patch"]
  - apiGroups: ["apps"]
    resources: ["replicasets"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "opencitadel.fullname" $ }}-ops-actuator-write
  namespace: {{ $ns }}
subjects:
  - kind: ServiceAccount
    name: {{ include "opencitadel.fullname" $ }}-ops-actuator
    namespace: {{ $.Release.Namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "opencitadel.fullname" $ }}-ops-actuator-write
{{- end }}
{{- end }}
