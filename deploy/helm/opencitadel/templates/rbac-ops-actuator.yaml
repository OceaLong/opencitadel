{{- if and .Values.opsActuator.enabled .Values.opsActuator.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "opencitadel.fullname" . }}-ops-actuator
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "opencitadel.fullname" . }}-ops-actuator-write
rules:
  - apiGroups: ["apps"]
    resources: ["deployments", "statefulsets"]
    verbs: ["get", "list", "watch", "patch"]
  - apiGroups: ["apps"]
    resources: ["replicasets"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "opencitadel.fullname" . }}-ops-actuator-write
subjects:
  - kind: ServiceAccount
    name: {{ include "opencitadel.fullname" . }}-ops-actuator
    namespace: {{ .Release.Namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "opencitadel.fullname" . }}-ops-actuator-write
{{- end }}
