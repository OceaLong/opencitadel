{{- if .Values.redis.enabled }}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "opencitadel.fullname" . }}-redis
spec:
  serviceName: {{ include "opencitadel.fullname" . }}-redis
  replicas: 1
  selector:
    matchLabels:
      {{- include "opencitadel.selectorLabels" (dict "root" $ "component" "redis") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "opencitadel.selectorLabels" (dict "root" $ "component" "redis") | nindent 8 }}
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        fsGroup: 999
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: redis
          image: {{ .Values.redis.image }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          ports:
            - containerPort: 6379
          env:
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ printf "%s-secret" (include "opencitadel.fullname" .) }}
                  key: REDIS_PASSWORD
          command:
            - sh
            - -c
            - >-
              exec redis-server --appendonly yes --maxmemory 256mb
              --maxmemory-policy allkeys-lru --requirepass "$REDIS_PASSWORD"
          readinessProbe:
            exec:
              command:
                - sh
                - -c
                - redis-cli --no-auth-warning -a "$REDIS_PASSWORD" ping
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            exec:
              command:
                - sh
                - -c
                - redis-cli --no-auth-warning -a "$REDIS_PASSWORD" ping
            initialDelaySeconds: 15
            periodSeconds: 20
          volumeMounts:
            - name: data
              mountPath: /data
          resources:
            {{- toYaml .Values.redis.resources | nindent 12 }}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: {{ .Values.redis.storage }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "opencitadel.fullname" . }}-redis
spec:
  selector:
    {{- include "opencitadel.selectorLabels" (dict "root" $ "component" "redis") | nindent 4 }}
  ports:
    - port: 6379
{{- end }}
