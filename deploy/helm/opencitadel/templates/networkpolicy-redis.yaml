{{- if and .Values.redis.enabled .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "opencitadel.fullname" . }}-redis
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/component: redis
  policyTypes: [Ingress]
  # 仅允许 api / execution-kernel 访问 6379。
  ingress:
    - from:
        - podSelector:
            matchExpressions:
              - key: app.kubernetes.io/component
                operator: In
                values:
                  - "api"
                  - "execution-kernel"
      ports:
        - {protocol: TCP, port: 6379}
{{- end }}
