{{- if not .Values.existingSecrets.postgresBootstrap }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "opencitadel.fullname" . }}-postgres-bootstrap-secret
  labels:
    app.kubernetes.io/component: postgres
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
stringData:
  POSTGRES_ADMIN_PASSWORD: {{ include "opencitadel.secretValue" (dict "root" . "group" "postgresBootstrap" "key" "POSTGRES_ADMIN_PASSWORD" "value" .Values.secrets.postgresAdminPassword "generate" true "minimum" 16) | quote }}
{{- end }}
