{{- if .Values.monitoring.serviceMonitor.enabled }}
{{- /*
Prometheus Operator 抓取配置：抓 api Service 的 /api/metrics。
启用本模板时，主 Secret 自动生成并持久保存 METRICS_TOKEN；显式
secrets.metricsToken 优先。引用外部主 Secret 时需预先提供这个键。
*/}}
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ include "opencitadel.fullname" . }}-api
  labels:
    app.kubernetes.io/component: api
    {{- with .Values.monitoring.serviceMonitor.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  selector:
    matchLabels:
      {{- include "opencitadel.selectorLabels" (dict "root" $ "component" "api") | nindent 6 }}
  endpoints:
    - port: http
      path: /api/metrics
      scheme: http
      interval: {{ .Values.monitoring.serviceMonitor.interval }}
      scrapeTimeout: {{ .Values.monitoring.serviceMonitor.scrapeTimeout }}
      # Bearer token 引用主 Secret 的 METRICS_TOKEN 键（secrets.metricsToken）。
      authorization:
        type: Bearer
        credentials:
          name: {{ include "opencitadel.secretName" (dict "root" . "group" "application") }}
          key: METRICS_TOKEN
{{- end }}
