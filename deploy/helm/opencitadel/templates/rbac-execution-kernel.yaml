{{- if .Values.rbac.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "opencitadel.fullname" . }}-execution-kernel
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "opencitadel.fullname" . }}-execution-kernel-sandbox
rules:
  - apiGroups: [""]
    resources: ["pods", "pods/log"]
    verbs: ["get", "list", "watch", "create", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "opencitadel.fullname" . }}-execution-kernel-sandbox
subjects:
  - kind: ServiceAccount
    name: {{ include "opencitadel.fullname" . }}-execution-kernel
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "opencitadel.fullname" . }}-execution-kernel-sandbox
{{- end }}
