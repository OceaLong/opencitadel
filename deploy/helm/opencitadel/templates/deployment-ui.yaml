{{- if .Values.ui.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "opencitadel.fullname" . }}-ui
  labels:
    app.kubernetes.io/component: ui
spec:
  replicas: {{ .Values.replicaCount.ui }}
  selector:
    matchLabels:
      {{- include "opencitadel.selectorLabels" (dict "root" $ "component" "ui") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "opencitadel.selectorLabels" (dict "root" $ "component" "ui") | nindent 8 }}
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: ui
          image: {{ include "opencitadel.image" (dict "root" $ "image" .Values.image.ui) | quote }}
          imagePullPolicy: {{ .Values.image.ui.pullPolicy }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          ports:
            - containerPort: 3000
          # 对照 docker-compose.yml opencitadel-ui 的 healthcheck
          # （GET /healthz，interval 15s / timeout 5s / retries 5 / start 30s）。
          readinessProbe:
            httpGet:
              path: /healthz
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: 3000
            initialDelaySeconds: 30
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 5
          resources:
            {{- toYaml .Values.resources.ui | nindent 12 }}
          volumeMounts:
            - name: nextjs-cache
              mountPath: /app/.next/cache
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: nextjs-cache
          emptyDir: {}
        - name: tmp
          emptyDir: {}
{{- end }}
