{{- if .Values.opsActuator.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "opencitadel.fullname" . }}-ops-actuator
  labels:
    app.kubernetes.io/component: ops-actuator
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "opencitadel.selectorLabels" (dict "root" $ "component" "ops-actuator") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "opencitadel.selectorLabels" (dict "root" $ "component" "ops-actuator") | nindent 8 }}
    spec:
      serviceAccountName: {{ if .Values.opsActuator.serviceAccount.create }}{{ include "opencitadel.fullname" . }}-ops-actuator{{ else }}{{ required "opsActuator.serviceAccount.name is required when serviceAccount.create=false" .Values.opsActuator.serviceAccount.name }}{{ end }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: actuator
          image: {{ include "opencitadel.image" (dict "root" . "image" .Values.opsActuator.image) }}
          imagePullPolicy: {{ .Values.opsActuator.image.pullPolicy }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          ports:
            - name: mcp
              containerPort: 8091
          env:
            - name: OPS_ACTUATOR_TARGET_REF
              value: {{ .Values.opsActuator.targetRef | quote }}
            - name: OPS_ACTUATOR_ALLOWED_NAMESPACES
              value: {{ .Values.opsActuator.allowedNamespaces | toJson | quote }}
            - name: OPS_ACTUATOR_ALLOWED_WORKLOADS
              value: {{ .Values.opsActuator.allowedWorkloads | toJson | quote }}
            - name: OPS_ACTUATOR_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ include "opencitadel.fullname" . }}-ops-actuator-secret
                  key: OPS_ACTUATOR_TOKEN
          readinessProbe:
            tcpSocket: {port: mcp}
          livenessProbe:
            tcpSocket: {port: mcp}
            initialDelaySeconds: 20
          resources:
            {{- toYaml .Values.opsActuator.resources | nindent 12 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 32Mi
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "opencitadel.fullname" . }}-ops-actuator
spec:
  selector:
    {{- include "opencitadel.selectorLabels" (dict "root" $ "component" "ops-actuator") | nindent 4 }}
  ports:
    - name: mcp
      port: 8091
      targetPort: mcp
{{- end }}
