{{- if and .Values.opsActuator.enabled (not .Values.existingSecrets.opsActuator) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "opencitadel.fullname" . }}-ops-actuator-secret
  labels:
    app.kubernetes.io/component: ops-actuator
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
stringData:
  OPS_ACTUATOR_TOKEN: {{ include "opencitadel.secretValue" (dict "root" . "group" "opsActuator" "key" "OPS_ACTUATOR_TOKEN" "value" .Values.opsActuator.token "generate" true "allowUpgradeGeneration" true "minimum" 32) | quote }}
{{- end }}
