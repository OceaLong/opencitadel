{{- if not .Values.existingSecrets.executionKernel }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "opencitadel.fullname" . }}-execution-kernel-secret
  labels:
    app.kubernetes.io/component: execution-kernel
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
stringData:
  POSTGRES_PASSWORD: {{ include "opencitadel.secretValue" (dict "root" . "group" "executionKernel" "key" "POSTGRES_PASSWORD" "value" .Values.secrets.executionKernelPostgresPassword "generate" true "minimum" 16) | quote }}
{{- end }}
