apiVersion: v1
kind: Service
metadata:
  name: {{ include "opencitadel.fullname" . }}-api
  labels:
    {{- include "opencitadel.selectorLabels" (dict "root" $ "component" "api") | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "opencitadel.selectorLabels" (dict "root" $ "component" "api") | nindent 4 }}
  ports:
    - port: 8000
      targetPort: 8000
      name: http
