{{- if .Values.egressProxy.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "opencitadel.fullname" . }}-egress-proxy
  labels:
    app.kubernetes.io/component: egress-proxy
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/component: egress-proxy
  ports:
    - name: proxy
      port: 3128
      targetPort: proxy
{{- end }}
