{{- if .Values.egressProxy.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "opencitadel.fullname" . }}-egress-proxy
  labels:
    app.kubernetes.io/component: egress-proxy
spec:
  type: ClusterIP
  selector:
    {{- include "opencitadel.selectorLabels" (dict "root" $ "component" "egress-proxy") | nindent 4 }}
  ports:
    - name: proxy
      port: 3128
      targetPort: proxy
{{- end }}
