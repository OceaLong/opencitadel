apiVersion: v1
kind: Secret
metadata:
  name: {{ include "opencitadel.fullname" . }}-secret
  labels:
    app.kubernetes.io/name: {{ include "opencitadel.fullname" . }}
type: Opaque
stringData:
  API_KEY_SECRET: {{ .Values.secrets.apiKeySecret | quote }}
  API_KEY_SECRET_ID: {{ .Values.secrets.apiKeySecretId | quote }}
  API_KEY_PREVIOUS_SECRETS: {{ .Values.secrets.apiKeyPreviousSecrets | quote }}
  AUDIT_SIGNING_KEY: {{ .Values.secrets.auditSigningKey | quote }}
  AUDIT_SIGNING_KEY_ID: {{ .Values.secrets.auditSigningKeyId | quote }}
  AUDIT_PREVIOUS_SIGNING_KEYS: {{ .Values.secrets.auditPreviousSigningKeys | quote }}
  JWT_SECRET: {{ .Values.secrets.jwtSecret | quote }}
  SESSION_SECRET: {{ .Values.secrets.sessionSecret | quote }}
  SANDBOX_TOKEN_SEED: {{ .Values.secrets.sandboxTokenSeed | quote }}
  BOOTSTRAP_ADMIN_EMAIL: {{ .Values.secrets.bootstrapAdminEmail | quote }}
  BOOTSTRAP_ADMIN_PASSWORD: {{ .Values.secrets.bootstrapAdminPassword | quote }}
  POSTGRES_PASSWORD: {{ .Values.secrets.postgresPassword | quote }}
  REDIS_PASSWORD: {{ .Values.secrets.redisPassword | quote }}
  COS_SECRET_ID: {{ .Values.secrets.cosSecretId | quote }}
  COS_SECRET_KEY: {{ .Values.secrets.cosSecretKey | quote }}
  MINIO_ACCESS_KEY: {{ .Values.secrets.minioAccessKey | quote }}
  MINIO_SECRET_KEY: {{ .Values.secrets.minioSecretKey | quote }}
  METRICS_TOKEN: {{ .Values.secrets.metricsToken | quote }}
