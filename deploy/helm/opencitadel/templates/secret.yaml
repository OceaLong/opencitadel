{{- if not .Values.existingSecrets.application }}
{{- $data := dict }}
{{- $fields := dict "API_KEY_SECRET" "apiKeySecret" "AUDIT_SIGNING_KEY" "auditSigningKey" "JWT_SECRET" "jwtSecret" "SESSION_SECRET" "sessionSecret" "SANDBOX_TOKEN_SEED" "sandboxTokenSeed" "BOOTSTRAP_ADMIN_PASSWORD" "bootstrapAdminPassword" "POSTGRES_PASSWORD" "postgresPassword" "REDIS_PASSWORD" "redisPassword" "MINIO_ACCESS_KEY" "minioAccessKey" "MINIO_SECRET_KEY" "minioSecretKey" }}
{{- range $key, $field := $fields }}
{{- $minimum := 32 }}
{{- if has $key (list "POSTGRES_PASSWORD" "REDIS_PASSWORD") }}{{- $minimum = 16 }}{{- end }}
{{- if eq $key "BOOTSTRAP_ADMIN_PASSWORD" }}{{- $minimum = 12 }}{{- end }}
{{- $generate := true }}
{{- $allowUpgradeGeneration := false }}
{{- if has $key (list "MINIO_ACCESS_KEY" "MINIO_SECRET_KEY") }}
{{- $minimum = 0 }}
{{- $generate = or $.Values.minio.enabled (eq (include "opencitadel.storageProvider" $) "minio") }}
{{- $allowUpgradeGeneration = $.Values.minio.enabled }}
{{- end }}
{{- $_ := set $data $key (include "opencitadel.secretValue" (dict "root" $ "group" "application" "key" $key "value" (get $.Values.secrets $field) "generate" $generate "allowUpgradeGeneration" $allowUpgradeGeneration "minimum" $minimum)) }}
{{- end }}
{{- $trustKeys := list (get $data "API_KEY_SECRET") (get $data "AUDIT_SIGNING_KEY") (get $data "JWT_SECRET") (get $data "SESSION_SECRET") }}
{{- if and (eq (lower (.Values.env.ENV | default "production")) "production") (ne (len (uniq $trustKeys)) 4) }}{{- fail "API, audit, JWT, and session signing secrets must be distinct" }}{{- end }}
{{- if and (eq (lower (.Values.env.ENV | default "production")) "production") (or .Values.minio.enabled (eq (include "opencitadel.storageProvider" .) "minio")) }}
{{- range $key := list "MINIO_ACCESS_KEY" "MINIO_SECRET_KEY" }}
{{- if or (eq (get $data $key) "minioadmin") (regexMatch "(?i)(replace-with|change-?me|change-in-production)" (get $data $key)) }}{{- fail "Production MinIO credentials must not use defaults or placeholders" }}{{- end }}
{{- end }}
{{- end }}
{{- $_ := set $data "DATABASE_AUTHORIZATION_SIGNING_SECRET" (include "opencitadel.secretValue" (dict "root" . "group" "application" "key" "DATABASE_AUTHORIZATION_SIGNING_SECRET" "value" .Values.secrets.databaseAuthorizationSigningSecret "generate" true "upgradeFallback" (get $data "SESSION_SECRET") "minimum" 32)) }}
{{- $_ := set $data "PUBLIC_CURSOR_SECRET" (include "opencitadel.secretValue" (dict "root" . "group" "application" "key" "PUBLIC_CURSOR_SECRET" "value" .Values.secrets.publicCursorSecret "generate" true "upgradeFallback" (get $data "API_KEY_SECRET" | sha256sum) "minimum" 32)) }}
{{- range $key, $field := dict "COS_SECRET_ID" "cosSecretId" "COS_SECRET_KEY" "cosSecretKey" }}
{{- $_ := set $data $key (include "opencitadel.secretValue" (dict "root" $ "group" "application" "key" $key "value" (get $.Values.secrets $field) "generate" false)) }}
{{- end }}
{{- $_ := set $data "METRICS_TOKEN" (include "opencitadel.secretValue" (dict "root" . "group" "application" "key" "METRICS_TOKEN" "value" .Values.secrets.metricsToken "generate" .Values.monitoring.serviceMonitor.enabled "allowUpgradeGeneration" true "minimum" 32)) }}
{{- $metadataFields := dict "API_KEY_SECRET_ID" (dict "field" "apiKeySecretId" "default" "primary") "API_KEY_PREVIOUS_SECRETS" (dict "field" "apiKeyPreviousSecrets" "default" "{}") "AUDIT_SIGNING_KEY_ID" (dict "field" "auditSigningKeyId" "default" "primary") "AUDIT_PREVIOUS_SIGNING_KEYS" (dict "field" "auditPreviousSigningKeys" "default" "{}") "BOOTSTRAP_ADMIN_EMAIL" (dict "field" "bootstrapAdminEmail" "default" "admin@example.com") }}
{{- range $key, $metadata := $metadataFields }}
{{- $_ := set $data $key (include "opencitadel.secretValue" (dict "root" $ "group" "application" "key" $key "value" (get $.Values.secrets $metadata.field) "defaultValue" $metadata.default)) }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "opencitadel.fullname" . }}-secret
  labels:
    app.kubernetes.io/name: {{ include "opencitadel.fullname" . }}
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
stringData:
  {{- toYaml $data | nindent 2 }}
{{- end }}
