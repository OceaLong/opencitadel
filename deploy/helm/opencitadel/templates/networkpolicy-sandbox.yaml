{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "opencitadel.fullname" . }}-sandbox
spec:
  podSelector:
    matchLabels:
      opencitadel.io/sandbox: "true"
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - podSelector:
            matchExpressions:
              - key: app.kubernetes.io/component
                operator: In
                values: ["api", "execution-kernel"]
      ports:
        - protocol: TCP
          port: 8080
        - protocol: TCP
          port: 5901
        - protocol: TCP
          port: 9222
  egress:
    # DNS is the only cluster-internal dependency available to an untrusted
    # sandbox. Application, database, cache and metadata ranges stay blocked.
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    # All sandbox egress must traverse the controlled egress proxy (squid),
    # which resolves destinations and enforces the address ACLs. The previous
    # 0.0.0.0/0 rule made the proxy pointless on K8s: the sandbox could reach
    # the public Internet (and, via redirect/rebinding, cluster-internal
    # private services) directly on 80/443. Egress is now收敛 to the proxy Pod
    # only, so anything the proxy denies is unreachable.
    #
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/component: egress-proxy
      ports:
        - protocol: TCP
          port: 3128
{{- end }}
