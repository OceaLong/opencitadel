apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "opencitadel.fullname" . }}-api
  labels:
    app.kubernetes.io/component: api
spec:
  replicas: {{ .Values.replicaCount.api }}
  selector:
    matchLabels:
      app.kubernetes.io/component: api
  template:
    metadata:
      labels:
        app.kubernetes.io/component: api
    spec:
      terminationGracePeriodSeconds: {{ .Values.shutdown.terminationGracePeriodSeconds }}
      {{- if .Values.topologySpread.enabled }}
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/component: api
      {{- end }}
      {{- $secretName := printf "%s-secret" (include "opencitadel.fullname" .) }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        {{- if .Values.migrate.enabled }}
        - name: migrate
          image: "{{ .Values.image.api.repository }}:{{ .Values.image.api.tag }}"
          command: ["python", "-m", "app.migrate"]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          envFrom:
            - secretRef:
                name: {{ $secretName }}
          env:
            {{- range $key, $value := .Values.env }}
            {{- if and (ne $key "POSTGRES_HOST") (ne $key "REDIS_HOST") (ne $key "MINIO_ENDPOINT") }}
            - name: {{ $key }}
              value: {{ $value | quote }}
            {{- end }}
            {{- end }}
            - name: POSTGRES_HOST
              value: {{ include "opencitadel.postgresHost" . | quote }}
            - name: REDIS_HOST
              value: {{ include "opencitadel.redisHost" . | quote }}
            - name: MINIO_ENDPOINT
              value: {{ include "opencitadel.minioEndpoint" . | quote }}
            - name: POSTGRES_ADMIN_USER
              value: {{ .Values.postgresql.migrationUser | quote }}
            - name: POSTGRES_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "opencitadel.fullname" . }}-migration-secret
                  key: POSTGRES_PASSWORD
          volumeMounts:
            - name: tmp
              mountPath: /tmp
        {{- end }}
      containers:
        - name: api
          image: "{{ .Values.image.api.repository }}:{{ .Values.image.api.tag }}"
          imagePullPolicy: {{ .Values.image.api.pullPolicy }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          ports:
            - containerPort: 8000
          readinessProbe:
            httpGet:
              path: /api/health/ready
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/health/live
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 20
          resources:
            {{- toYaml .Values.resources.api | nindent 12 }}
          envFrom:
            - secretRef:
                name: {{ $secretName }}
          env:
            - name: OPENCITADEL_SHUTDOWN_TIMEOUT_SECONDS
              value: {{ .Values.shutdown.timeoutSeconds | quote }}
            {{- range $key, $value := .Values.env }}
            {{- if and (ne $key "POSTGRES_HOST") (ne $key "REDIS_HOST") (ne $key "MINIO_ENDPOINT") (ne $key "SANDBOX_HTTP_PROXY") (ne $key "SANDBOX_HTTPS_PROXY") (ne $key "SANDBOX_CHROME_ARGS") }}
            - name: {{ $key }}
              value: {{ $value | quote }}
            {{- end }}
            {{- end }}
            - name: POSTGRES_HOST
              value: {{ include "opencitadel.postgresHost" . | quote }}
            - name: REDIS_HOST
              value: {{ include "opencitadel.redisHost" . | quote }}
            - name: MINIO_ENDPOINT
              value: {{ include "opencitadel.minioEndpoint" . | quote }}
            # Sandbox egress proxy: injected via helper so it resolves to the
            # in-cluster egress-proxy Service when egressProxy.enabled.
            - name: SANDBOX_HTTP_PROXY
              value: {{ include "opencitadel.sandboxHttpProxy" . | quote }}
            - name: SANDBOX_HTTPS_PROXY
              value: {{ include "opencitadel.sandboxHttpsProxy" . | quote }}
            - name: SANDBOX_CHROME_ARGS
              value: {{ include "opencitadel.sandboxChromeArgs" . | quote }}
            - name: POSTGRES_ADMIN_USER
              value: ""
            - name: POSTGRES_ADMIN_PASSWORD
              value: ""
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
