apiVersion: v1
kind: Service
metadata:
  name: {{ include "opencitadel.fullname" . }}-ui
  labels:
    app.kubernetes.io/component: ui
spec:
  type: ClusterIP
  selector:
    {{- include "opencitadel.selectorLabels" (dict "root" $ "component" "ui") | nindent 4 }}
  ports:
    - port: 3000
      targetPort: 3000
      name: http
