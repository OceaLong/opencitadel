{{- if .Values.postgresql.enabled }}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "opencitadel.fullname" . }}-postgres
spec:
  serviceName: {{ include "opencitadel.fullname" . }}-postgres
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/component: postgres
  template:
    metadata:
      labels:
        app.kubernetes.io/component: postgres
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        fsGroup: 999
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: postgres
          image: {{ .Values.postgresql.image }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          ports:
            - containerPort: 5432
          # 参考 docker-compose.yml postgres 段的 healthcheck。POSTGRES_USER 在此
          # StatefulSet 中即 adminUser，POSTGRES_DB 为业务库名。
          readinessProbe:
            exec:
              command: ["sh", "-c", "pg_isready -U \"$POSTGRES_USER\" -d \"$POSTGRES_DB\""]
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          livenessProbe:
            exec:
              command: ["sh", "-c", "pg_isready -U \"$POSTGRES_USER\" -d \"$POSTGRES_DB\""]
            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 6
          env:
            - name: POSTGRES_USER
              value: {{ .Values.postgresql.adminUser | quote }}
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "opencitadel.fullname" . }}-postgres-bootstrap-secret
                  key: POSTGRES_ADMIN_PASSWORD
            - name: POSTGRES_DB
              value: {{ .Values.postgresql.database | quote }}
            - name: OPENCITADEL_APP_USER
              value: {{ .Values.postgresql.user | quote }}
            - name: OPENCITADEL_APP_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ printf "%s-secret" (include "opencitadel.fullname" .) }}
                  key: POSTGRES_PASSWORD
            - name: OPENCITADEL_MIGRATION_USER
              value: {{ .Values.postgresql.migrationUser | quote }}
            - name: OPENCITADEL_MIGRATION_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "opencitadel.fullname" . }}-migration-secret
                  key: POSTGRES_PASSWORD
            - name: OPENCITADEL_KERNEL_USER
              value: {{ .Values.executionKernel.databaseUser | quote }}
            - name: OPENCITADEL_KERNEL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "opencitadel.fullname" . }}-execution-kernel-secret
                  key: POSTGRES_PASSWORD
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
            - name: postgres-init
              mountPath: /docker-entrypoint-initdb.d/10-opencitadel-app-role.sh
              subPath: init-app-role.sh
              readOnly: true
            - name: postgres-run
              mountPath: /var/run/postgresql
            - name: tmp
              mountPath: /tmp
          resources:
            {{- toYaml .Values.postgresql.resources | nindent 12 }}
      volumes:
        - name: postgres-init
          configMap:
            name: {{ include "opencitadel.fullname" . }}-postgres-init
            defaultMode: 0550
        - name: postgres-run
          emptyDir: {}
        - name: tmp
          emptyDir: {}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: {{ .Values.postgresql.storage }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "opencitadel.fullname" . }}-postgres
spec:
  clusterIP: None
  selector:
    app.kubernetes.io/component: postgres
  ports:
    - port: 5432
{{- end }}
