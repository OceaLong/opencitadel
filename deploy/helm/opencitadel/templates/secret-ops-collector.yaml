{{- if and .Values.opsCollector.enabled (not .Values.existingSecrets.opsCollector) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "opencitadel.fullname" . }}-ops-collector-secret
  labels:
    app.kubernetes.io/component: ops-collector
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
stringData:
  OPS_COLLECTOR_TOKEN: {{ include "opencitadel.secretValue" (dict "root" . "group" "opsCollector" "key" "OPS_COLLECTOR_TOKEN" "value" .Values.opsCollector.token "generate" true "allowUpgradeGeneration" true "minimum" 32) | quote }}
{{- end }}
