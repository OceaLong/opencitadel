{{- if and .Values.opsCollector.enabled .Values.opsCollector.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "opencitadel.fullname" . }}-ops-collector
{{- /*
  Namespaced Role/RoleBinding per allowed namespace instead of a cluster-wide
  ClusterRole. Every namespaced resource the Collector reads (pods, pods/log,
  events, services, pvc, workloads, jobs) is scoped exactly to
  opsCollector.allowedNamespaces. Nodes are the sole exception: they are a
  cluster-scoped resource and cannot be granted through a namespaced Role, so a
  minimal read-only ClusterRole below grants nodes get/list/watch and nothing
  else.
*/}}
{{- range $ns := .Values.opsCollector.allowedNamespaces }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "opencitadel.fullname" $ }}-ops-collector-readonly
  namespace: {{ $ns }}
rules:
  - apiGroups: [""]
    resources: ["pods", "pods/log", "events", "services", "persistentvolumeclaims"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apps"]
    resources: ["deployments", "statefulsets", "daemonsets", "replicasets"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["batch"]
    resources: ["jobs", "cronjobs"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "opencitadel.fullname" $ }}-ops-collector-readonly
  namespace: {{ $ns }}
subjects:
  - kind: ServiceAccount
    name: {{ include "opencitadel.fullname" $ }}-ops-collector
    namespace: {{ $.Release.Namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "opencitadel.fullname" $ }}-ops-collector-readonly
{{- end }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "opencitadel.fullname" . }}-ops-collector-nodes-readonly
rules:
  - apiGroups: [""]
    resources: ["nodes"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "opencitadel.fullname" . }}-ops-collector-nodes-readonly
subjects:
  - kind: ServiceAccount
    name: {{ include "opencitadel.fullname" . }}-ops-collector
    namespace: {{ .Release.Namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "opencitadel.fullname" . }}-ops-collector-nodes-readonly
{{- end }}
