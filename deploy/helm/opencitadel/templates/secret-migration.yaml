{{- if not .Values.existingSecrets.migration }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "opencitadel.fullname" . }}-migration-secret
  labels:
    app.kubernetes.io/component: migration
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
stringData:
  POSTGRES_PASSWORD: {{ include "opencitadel.secretValue" (dict "root" . "group" "migration" "key" "POSTGRES_PASSWORD" "value" .Values.secrets.postgresMigrationPassword "generate" true "minimum" 16) | quote }}
{{- end }}
