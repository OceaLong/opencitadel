replicaCount:
  api: 2
  ui: 1

# 镜像默认指向 GHCR 发布仓库。tag 留空时模板回退到 Chart.appVersion
# （见 _helpers.tpl 的 opencitadel.image 助手），随 chart 发布自动对齐。
image:
  api:
    repository: ghcr.io/ocealong/opencitadel-api
    tag: ""
    pullPolicy: IfNotPresent
  executionKernel:
    repository: ghcr.io/ocealong/opencitadel-execution-kernel
    tag: ""
    pullPolicy: IfNotPresent
  ui:
    repository: ghcr.io/ocealong/opencitadel-ui
    tag: ""
    pullPolicy: IfNotPresent
  sandbox:
    repository: ghcr.io/ocealong/opencitadel-sandbox
    tag: ""

ui:
  enabled: true

executionKernel:
  replicas: 2
  databaseUser: opencitadel_execution_kernel_runtime
  metricsPort: 9108

shutdown:
  timeoutSeconds: 90
  terminationGracePeriodSeconds: 120

opsCollector:
  enabled: false
  image:
    repository: ghcr.io/ocealong/opencitadel-ops-collector
    tag: ""  # 空 = 跟随 Chart.appVersion
    pullPolicy: IfNotPresent
  targetRef: opencitadel-local
  allowedNamespaces: [opencitadel]
  allowedWorkloads: {}
  # Bearer token the streamable-http endpoint requires (env OPS_COLLECTOR_TOKEN).
  # Empty generates a strong token on installation; explicit values override it.
  # Callers connect with `Authorization: Bearer <token>`.
  token: ""
  registeredPrometheusQueries: {}
  registeredHttpProbes: {}
  registeredCertificateProbes: {}
  registeredBackups: {}
  registeredDependencies: {}
  serviceAccount:
    create: true
    name: ""
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 256Mi

opsActuator:
  enabled: false
  image:
    repository: ghcr.io/ocealong/opencitadel-ops-actuator
    tag: ""  # 空 = 跟随 Chart.appVersion
    pullPolicy: IfNotPresent
  targetRef: opencitadel-local
  allowedNamespaces: [opencitadel]
  allowedWorkloads: {}
  # Bearer token the streamable-http endpoint requires (env OPS_ACTUATOR_TOKEN).
  # Empty generates a strong token on installation; explicit values override it.
  # Callers connect with `Authorization: Bearer <token>`.
  token: ""
  serviceAccount:
    create: true
    name: ""
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 256Mi

rbac:
  create: true

postgresql:
  enabled: true
  image: pgvector/pgvector:pg16
  adminUser: postgres
  migrationUser: opencitadel_migration_runtime
  user: opencitadel_app
  database: opencitadel
  storage: 20Gi
  resources:
    requests:
      cpu: 500m
      memory: 512Mi
    limits:
      cpu: 1500m
      memory: 1Gi

redis:
  enabled: true
  image: redis:7-alpine
  storage: 5Gi
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi

minio:
  # Default object storage for a new release. Complete legacy env.COS_REGION /
  # COS_BUCKET settings retain COS unless env.STORAGE_PROVIDER explicitly differs.
  # Set enabled=false when the in-chart MinIO service is not needed.
  enabled: true
  image: minio/minio:latest
  storage: 20Gi
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi

resourceQuota:
  enabled: true
  maxSandboxPods: "20"
  requestsMemory: "20Gi"

networkPolicy:
  enabled: true

# 沙箱出站代理（squid）。沙箱运行在无默认网关的隔离网络里，所有出站必须经此
# 代理，由它解析目标并执行私网/元数据黑名单（策略同 deploy/squid/squid.conf）。
# networkpolicy-sandbox 已把沙箱 egress 收敛为「仅 kube-dns:53 + 到本代理
# Pod 的 3128」，故默认启用。若关闭（egressProxy.enabled=false），必须同时放开
# 沙箱 NetworkPolicy，否则沙箱除 DNS 外无任何出站（fail-closed）。
egressProxy:
  enabled: true
  # 与 docker-compose.yml 的 opencitadel-sandbox-egress 一致。
  image: ubuntu/squid:6.6-24.04_edge
  imagePullPolicy: IfNotPresent
  replicas: 1
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 256Mi
  # 预留：按域名收紧出站白名单。当前 squid.conf 采用「私网/元数据黑名单 +
  # 公网 Safe_ports 放行」策略，未按域名白名单过滤；如需启用需改造
  # configmap-egress-proxy.yaml 为内联渲染而非 .Files.Get 直取静态文件。
  allowedDomains: []

# PodDisruptionBudget，保证滚动更新/节点排空期间关键工作负载至少保留一个可用副本。
# 需配合多副本使用（replicaCount.api / executionKernel.replicas >= 2），
# 否则 minAvailable:1 会阻止自愿驱逐（如节点维护）。
pdb:
  enabled: false
  api:
    minAvailable: 1
  executionKernel:
    minAvailable: 1

# 部署韧性：为 api / execution-kernel 跨节点分散副本。默认使用
# topologySpreadConstraints（软约束 ScheduleAnyway，单节点集群也能调度）。
topologySpread:
  enabled: true

# 监控告警。启用后渲染 PrometheusRule CRD（需集群已安装 Prometheus Operator）。
# 部分表达式依赖 F1/F2 计划落地的指标（http_requests_total、rate_limit_rejected_total
# 等），指标未落地前对应规则不会触发（no data），不影响其余规则。
monitoring:
  # 启用后渲染 ServiceMonitor CRD（需集群已安装 Prometheus Operator），
  # 抓取 api Service 的 /api/metrics，Bearer token 引用主 Secret 的
  # METRICS_TOKEN 键。启用时首次自动生成并持久保存 token；也可显式提供。
  serviceMonitor:
    enabled: false
    # 抓取间隔 / 超时（Prometheus duration 格式）。
    interval: 30s
    scrapeTimeout: 10s
    # 附加到 ServiceMonitor metadata.labels，供 Prometheus Operator
    # serviceMonitorSelector 选中，例如 {release: kube-prometheus-stack}。
    labels: {}
  prometheusRule:
    enabled: false
    # 留空则渲染到 Release namespace。指定后写入该 namespace（须与 Prometheus
    # ruleSelector 的 namespaceSelector 匹配）。
    namespace: ""
    # 附加到 PrometheusRule metadata.labels，供 Prometheus Operator ruleSelector 选中，
    # 例如 {release: kube-prometheus-stack}。
    labels: {}

# 内置 Postgres 逻辑备份 CronJob（pg_dump）。默认关闭；生产建议使用外部/托管
# 数据库自身的备份能力或 CloudNativePG。启用后其 registeredBackups 名称
# "opencitadel-postgres-backup" 可对应 Ops Patrol 的 opsCollector.registeredBackups，
# 使巡检的备份项有真实来源。
backup:
  enabled: false
  # cron 表达式（集群时区，通常 UTC）。默认每日 02:00。
  schedule: "0 2 * * *"
  # 转储保留份数，超出后按时间删除最旧的。
  retention: 7
  # 转储落地方式：pvc(默认，写入独立 PVC) 亦为纯离线评估级；生产应改为对象存储。
  storage: 5Gi
  # 使用与 Postgres 同族的镜像以保证 pg_dump 版本兼容。
  image: pgvector/pgvector:pg16
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 256Mi

service:
  type: ClusterIP
  port: 80

ingress:
  enabled: false
  host: ""
  className: ""
  # 自定义 annotations，与默认安全响应头 annotations 合并（同 key 时以此处为准）。
  annotations: {}
  # 默认注入安全响应头 annotations（HSTS / CSP / nosniff / Referrer-Policy，
  # 面向 ingress-nginx 的 configuration-snippet）。CSP 内容取
  # securityHeaders.contentSecurityPolicy。置 false 可完全关闭默认注入。
  securityHeaders: true
  # TLS 配置，结构同 networking.k8s.io/v1 Ingress 的 spec.tls，例如：
  # tls:
  #   - hosts: [opencitadel.local]
  #     secretName: opencitadel-tls
  tls: []

# 安全响应头单一来源。默认值与 deploy/nginx/templates/default.http(s).conf.template
# 中现行 CSP 保持一致；改这里即可同步 ingress 注入的 CSP，避免双份漂移。
securityHeaders:
  contentSecurityPolicy: >-
    default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self'
    'unsafe-inline'; img-src 'self' data: blob:; frame-ancestors 'none';
    object-src 'none'; base-uri 'self'

autoscaling:
  api:
    enabled: true
    minReplicas: 2
    maxReplicas: 10
    targetCPUUtilizationPercentage: 70
  executionKernel:
    enabled: true
    minReplicas: 2
    maxReplicas: 20
    targetCPUUtilizationPercentage: 75

resources:
  api:
    requests:
      cpu: 500m
      memory: 512Mi
    limits:
      cpu: 2
      memory: 1Gi
  executionKernel:
    requests:
      cpu: 500m
      memory: 512Mi
    limits:
      cpu: 2
      memory: 1024Mi
  ui:
    requests:
      cpu: 200m
      memory: 256Mi
    limits:
      cpu: 1
      memory: 384Mi

# Public site origin. Required in production unless ingress.host or the legacy
# env.FRONTEND_BASE_URL override supplies the origin. OAuth URL and cookies
# follow this origin unless explicitly overridden in env.
publicUrl: ""

# Advanced deployment overrides. Internal service names, database identity,
# storage provider, sandbox namespace/image/proxy, and site settings are derived.
# Existing env.* overrides remain supported.
env:
  ENV: production
  LOG_LEVEL: INFO
  SANDBOX_DRIVER: kubernetes

# Bring your own Kubernetes Secrets by trust domain. Leave empty to manage
# release Secrets: generate once on install, then reuse via lookup on upgrade.
existingSecrets:
  application: ""
  postgresBootstrap: ""
  migration: ""
  executionKernel: ""
  opsCollector: ""
  opsActuator: ""

# Optional explicit credentials. Empty values are generated once and persisted
# in release Secrets; explicit values take priority and are never auto-rotated.
secrets:
  apiKeySecret: ""
  apiKeySecretId: ""  # first install: primary; otherwise reuse existing metadata
  apiKeyPreviousSecrets: ""
  auditSigningKey: ""
  auditSigningKeyId: ""
  auditPreviousSigningKeys: ""
  jwtSecret: ""
  sessionSecret: ""
  # Existing releases without this key keep their session-secret HMAC fallback.
  databaseAuthorizationSigningSecret: ""
  # Existing releases without this key keep sha256(API_KEY_SECRET) cursors.
  publicCursorSecret: ""
  # Independent seed for derived per-sandbox access tokens.
  sandboxTokenSeed: ""
  bootstrapAdminEmail: ""  # first install: admin@example.com
  bootstrapAdminPassword: ""
  postgresAdminPassword: ""
  postgresMigrationPassword: ""
  postgresPassword: ""
  executionKernelPostgresPassword: ""
  redisPassword: ""
  cosSecretId: ""
  cosSecretKey: ""
  minioAccessKey: ""
  minioSecretKey: ""
  # Generated when ServiceMonitor is enabled; empty otherwise disables metrics.
  metricsToken: ""

migrate:
  enabled: true
