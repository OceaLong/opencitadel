replicaCount:
  api: 2
  ui: 1

image:
  api:
    repository: opencitadel-api
    tag: latest
    pullPolicy: IfNotPresent
  executionKernel:
    repository: opencitadel-execution-kernel
    tag: latest
    pullPolicy: IfNotPresent
  ui:
    repository: opencitadel-ui
    tag: latest
    pullPolicy: IfNotPresent
  sandbox:
    repository: opencitadel-sandbox
    tag: latest

ui:
  enabled: true

executionKernel:
  replicas: 2
  databaseUser: opencitadel_execution_kernel_runtime
  metricsPort: 9108

shutdown:
  timeoutSeconds: 30
  terminationGracePeriodSeconds: 45

opsCollector:
  enabled: false
  image:
    repository: opencitadel-ops-collector
    tag: latest
    pullPolicy: IfNotPresent
  targetRef: opencitadel-local
  allowedNamespaces: [opencitadel]
  allowedWorkloads: {}
  registeredPrometheusQueries: {}
  registeredHttpProbes: {}
  registeredCertificateProbes: {}
  registeredBackups: {}
  registeredDependencies: {}
  serviceAccount:
    create: true
    name: ""
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 256Mi

opsActuator:
  enabled: false
  image:
    repository: opencitadel-ops-actuator
    tag: latest
    pullPolicy: IfNotPresent
  targetRef: opencitadel-local
  allowedNamespaces: [opencitadel]
  allowedWorkloads: {}
  serviceAccount:
    create: true
    name: ""
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 256Mi

rbac:
  create: true

postgresql:
  enabled: true
  image: pgvector/pgvector:pg16
  adminUser: postgres
  migrationUser: opencitadel_migration_runtime
  user: opencitadel_app
  database: opencitadel
  storage: 20Gi
  resources:
    requests:
      cpu: 500m
      memory: 512Mi
    limits:
      cpu: 1500m
      memory: 1Gi

redis:
  enabled: true
  image: redis:7-alpine
  storage: 5Gi
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi

minio:
  enabled: false
  image: minio/minio:latest
  storage: 20Gi
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi

resourceQuota:
  enabled: true
  maxSandboxPods: "20"
  requestsMemory: "20Gi"

networkPolicy:
  enabled: true

service:
  type: ClusterIP
  port: 80

ingress:
  enabled: false
  host: opencitadel.local
  className: ""
  annotations: {}

autoscaling:
  api:
    enabled: true
    minReplicas: 2
    maxReplicas: 10
    targetCPUUtilizationPercentage: 70
  executionKernel:
    enabled: true
    minReplicas: 2
    maxReplicas: 20
    targetCPUUtilizationPercentage: 75

resources:
  api:
    requests:
      cpu: 500m
      memory: 512Mi
    limits:
      cpu: 2
      memory: 1Gi
  executionKernel:
    requests:
      cpu: 500m
      memory: 512Mi
    limits:
      cpu: 2
      memory: 1024Mi
  ui:
    requests:
      cpu: 200m
      memory: 256Mi
    limits:
      cpu: 1
      memory: 384Mi

# 非敏感部署环境变量（对应 api/core/config.py DeploymentSettings）
env:
  ENV: production
  LOG_LEVEL: INFO
  CORS_ORIGINS: "*"
  OTEL_ENABLED: "false"
  OTEL_SERVICE_NAME: opencitadel-api
  OTEL_EXPORTER_ENDPOINT: ""
  POLICY_HEAD_REFRESH_INTERVAL_SECONDS: "5"
  POLICY_MAX_STALENESS_SECONDS: "30"
  SANDBOX_DRIVER: kubernetes
  SANDBOX_IMAGE: opencitadel-sandbox
  SANDBOX_NAME_PREFIX: opencitadel-sandbox
  SANDBOX_NETWORK: ""
  SANDBOX_CHROME_ARGS: ""
  SANDBOX_HTTPS_PROXY: ""
  SANDBOX_HTTP_PROXY: ""
  SANDBOX_NO_PROXY: ""
  SANDBOX_K8S_NAMESPACE: default
  SANDBOX_K8S_POD_LABEL: app=opencitadel-sandbox
  POSTGRES_HOST: opencitadel-postgres
  POSTGRES_USER: opencitadel_app
  POSTGRES_DB: opencitadel
  REDIS_HOST: opencitadel-redis
  REDIS_PORT: "6379"
  REDIS_DB: "0"
  COOKIE_SECURE: "true"
  OUTBOUND_ALLOWED_PORTS: "80,443,8080,8443,11434"
  OUTBOUND_PRIVATE_HOST_ALLOWLIST: ""
  # Set to the exact ingress-controller or service-mesh proxy CIDRs.
  TRUSTED_PROXY_CIDRS: "10.0.0.0/8"
  FRONTEND_BASE_URL: https://opencitadel.local
  OAUTH_REDIRECT_BASE: https://opencitadel.local/api/auth/oauth
  STORAGE_PROVIDER: cos
  COS_REGION: ""
  COS_SCHEME: https
  COS_BUCKET: ""
  COS_DOMAIN: ""
  MINIO_ENDPOINT: ""  # STORAGE_PROVIDER=minio 时必填，空串会覆盖代码默认值 opencitadel-minio:9000
  MINIO_BUCKET: opencitadel
  MINIO_SECURE: "false"

# 敏感配置（渲染为 Secret，通过 envFrom 注入）
secrets:
  apiKeySecret: replace-with-strong-random-secret
  apiKeySecretId: primary
  apiKeyPreviousSecrets: "{}"
  auditSigningKey: replace-with-distinct-strong-audit-key
  auditSigningKeyId: primary
  auditPreviousSigningKeys: "{}"
  jwtSecret: replace-with-strong-random-secret
  sessionSecret: replace-with-strong-random-secret
  bootstrapAdminEmail: admin@example.com
  bootstrapAdminPassword: replace-with-strong-password
  postgresAdminPassword: replace-with-distinct-admin-password
  postgresMigrationPassword: replace-with-distinct-migration-password
  postgresPassword: replace-with-strong-postgres-password
  executionKernelPostgresPassword: replace-with-distinct-kernel-postgres-password
  redisPassword: replace-with-strong-redis-password
  cosSecretId: ""
  cosSecretKey: ""
  minioAccessKey: minioadmin
  minioSecretKey: minioadmin
  # /api/metrics 的 Bearer token；留空表示该端点 fail-closed 关闭（404）。
  # 启用 Prometheus 抓取前需设置为强随机值。
  metricsToken: ""

migrate:
  enabled: true
