# NGINX only needs writable process/cache scratch; all other paths stay read-only.
apiVersion: v1
kind: ConfigMap
metadata:
  name: patrol-nginx-config
  namespace: opencitadel-patrol-demo
data:
  nginx.conf: |
    worker_processes 1;
    pid /tmp/nginx.pid;
    error_log /dev/stderr notice;
    events { worker_connections 128; }
    http {
      include /etc/nginx/mime.types;
      access_log /dev/stdout;
      client_body_temp_path /tmp/client_temp;
      proxy_temp_path /tmp/proxy_temp;
      fastcgi_temp_path /tmp/fastcgi_temp;
      uwsgi_temp_path /tmp/uwsgi_temp;
      scgi_temp_path /tmp/scgi_temp;
      server {
        listen 8080;
        root /usr/share/nginx/html;
        index index.html;
      }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: healthy-app
  namespace: opencitadel-patrol-demo
spec:
  replicas: 1
  selector:
    matchLabels: {app: healthy-app}
  template:
    metadata:
      labels: {app: healthy-app}
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile: {type: RuntimeDefault}
        fsGroup: 10001
      containers:
        - name: app
          securityContext: {readOnlyRootFilesystem: true, allowPrivilegeEscalation: false, capabilities: {drop: [ALL]}}
          image: nginx:1.27-alpine
          command: ["nginx", "-c", "/etc/patrol-nginx/nginx.conf", "-g", "daemon off;"]
          volumeMounts:
            - {name: nginx-config, mountPath: /etc/patrol-nginx, readOnly: true}
            - {name: nginx-tmp, mountPath: /tmp}
          ports: [{containerPort: 8080}]
          readinessProbe:
            httpGet: {path: /, port: 8080}
          resources:
            requests: {cpu: 10m, memory: 16Mi}
            limits: {cpu: 100m, memory: 64Mi}
      volumes:
        - name: nginx-config
          configMap: {name: patrol-nginx-config}
        - name: nginx-tmp
          emptyDir: {sizeLimit: 16Mi}
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: healthy-heartbeat
  namespace: opencitadel-patrol-demo
spec:
  schedule: "*/5 * * * *"
  jobTemplate:
    spec:
      template:
        spec:
          restartPolicy: Never
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
            seccompProfile: {type: RuntimeDefault}
          containers:
            - name: heartbeat
              securityContext: {readOnlyRootFilesystem: true, allowPrivilegeEscalation: false, capabilities: {drop: [ALL]}}
              image: busybox:1.36
              command: ["sh", "-c", "date"]
