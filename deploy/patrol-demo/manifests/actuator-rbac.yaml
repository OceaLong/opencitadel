apiVersion: v1
kind: ServiceAccount
metadata:
  name: patrol-actuator
  namespace: opencitadel-patrol-demo
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: opencitadel-patrol-demo-actuator-write
rules:
  - apiGroups: ["apps"]
    resources: ["deployments", "statefulsets"]
    verbs: ["get", "list", "watch", "patch"]
  - apiGroups: ["apps"]
    resources: ["replicasets"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: opencitadel-patrol-demo-actuator-write
  namespace: opencitadel-patrol-demo
subjects:
  - kind: ServiceAccount
    name: patrol-actuator
    namespace: opencitadel-patrol-demo
  - kind: ServiceAccount
    name: opencitadel-ops-actuator
    namespace: opencitadel
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: opencitadel-patrol-demo-actuator-write
