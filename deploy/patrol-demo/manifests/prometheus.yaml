# The deterministic demo uses the registered-query-compatible endpoint in
# mock-services.yaml. It implements only /api/v1/query and accepts no raw query
# from the Agent; PromQL remains administrator-owned Collector configuration.
apiVersion: v1
kind: Service
metadata:
  name: patrol-prometheus
  namespace: opencitadel-patrol-demo
spec:
  selector: {app: patrol-mock}
  ports: [{name: http, port: 9090, targetPort: 8080}]
