apiVersion: v1
kind: ConfigMap
metadata:
  name: patrol-mock-script
  namespace: opencitadel-patrol-demo
data:
  server.py: |
    import json, pathlib
    from datetime import datetime, timedelta, timezone
    from http.server import BaseHTTPRequestHandler, HTTPServer
    class Handler(BaseHTTPRequestHandler):
        def do_GET(self):
            state = json.loads(pathlib.Path('/state/state.json').read_text())
            if self.path.startswith('/api/v1/query'):
                query = self.path.lower()
                value = state['pvc_percent'] if 'pvc' in query else state['app_5xx_ratio']
                body = {'status':'success','data':{'resultType':'vector','result':[{'metric':{},'value':[0,str(value)]}]}}
            elif self.path == '/backup':
                age = float(state['backup_age_hours'])
                body = {'state':'success','last_success_at':(datetime.now(timezone.utc)-timedelta(hours=age)).isoformat()}
            else:
                body = {'healthy': bool(state['endpoint_healthy'])}
            payload = json.dumps(body).encode()
            self.send_response(200 if state.get('endpoint_healthy', True) else 503)
            self.send_header('Content-Type','application/json'); self.end_headers(); self.wfile.write(payload)
        def log_message(self, *_): pass
    HTTPServer(('0.0.0.0', 8080), Handler).serve_forever()
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: patrol-fixture-state
  namespace: opencitadel-patrol-demo
data:
  state.json: '{"app_5xx_ratio":0,"pvc_percent":10,"backup_age_hours":1,"endpoint_healthy":true}'
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: patrol-mock
  namespace: opencitadel-patrol-demo
spec:
  replicas: 1
  selector:
    matchLabels: {app: patrol-mock}
  template:
    metadata:
      labels: {app: patrol-mock}
    spec:
      containers:
        - name: mock
          image: python:3.12-alpine
          command: ["python", "/script/server.py"]
          ports: [{containerPort: 8080}]
          volumeMounts:
            - {name: script, mountPath: /script, readOnly: true}
            - {name: state, mountPath: /state, readOnly: true}
      volumes:
        - name: script
          configMap: {name: patrol-mock-script}
        - name: state
          configMap: {name: patrol-fixture-state}
---
apiVersion: v1
kind: Service
metadata:
  name: patrol-mock
  namespace: opencitadel-patrol-demo
spec:
  selector: {app: patrol-mock}
  ports: [{name: http, port: 8080, targetPort: 8080}]
