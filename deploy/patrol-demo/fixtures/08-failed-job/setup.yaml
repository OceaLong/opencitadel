apiVersion: batch/v1
kind: Job
metadata:
  name: fixture-failed-job
  namespace: opencitadel-patrol-demo
  labels: {opencitadel.io/patrol-fixture: "true"}
spec:
  backoffLimit: 0
  template:
    metadata: {labels: {opencitadel.io/patrol-fixture: "true"}}
    spec:
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile: {type: RuntimeDefault}
      containers: [{name: job, securityContext: {readOnlyRootFilesystem: true, allowPrivilegeEscalation: false, capabilities: {drop: [ALL]}}, image: busybox:1.36, command: ["sh", "-c", "exit 1"]}]
