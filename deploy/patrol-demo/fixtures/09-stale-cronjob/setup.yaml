apiVersion: batch/v1
kind: CronJob
metadata:
  name: fixture-stale-cronjob
  namespace: opencitadel-patrol-demo
  labels: {opencitadel.io/patrol-fixture: "true"}
  annotations: {ops.opencitadel.io/last-success-at: "2026-01-01T00:00:00Z"}
spec:
  schedule: "0 * * * *"
  suspend: true
  jobTemplate:
    spec:
      template:
        spec:
          restartPolicy: Never
          containers: [{name: job, image: busybox:1.36, command: ["true"]}]
