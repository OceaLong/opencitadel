apiVersion: apps/v1
kind: Deployment
metadata:
  name: fixture-restarts-warn
  namespace: opencitadel-patrol-demo
  labels: {opencitadel.io/patrol-fixture: "true", opencitadel.io/restart-target: "4"}
spec:
  replicas: 1
  selector: {matchLabels: {app: fixture-restarts-warn}}
  template:
    metadata: {labels: {app: fixture-restarts-warn, opencitadel.io/patrol-fixture: "true"}}
    spec:
      containers:
        - {name: restart-01, image: busybox:1.36, command: ["sh", "-c", "exit 1"]}
        - {name: restart-02, image: busybox:1.36, command: ["sh", "-c", "exit 1"]}
        - {name: restart-03, image: busybox:1.36, command: ["sh", "-c", "exit 1"]}
        - {name: restart-04, image: busybox:1.36, command: ["sh", "-c", "exit 1"]}
