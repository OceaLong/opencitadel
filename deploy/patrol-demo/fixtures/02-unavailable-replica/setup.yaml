apiVersion: apps/v1
kind: Deployment
metadata:
  name: fixture-unavailable
  namespace: opencitadel-patrol-demo
  labels: {opencitadel.io/patrol-fixture: "true"}
spec:
  replicas: 1
  selector: {matchLabels: {app: fixture-unavailable}}
  template:
    metadata: {labels: {app: fixture-unavailable, opencitadel.io/patrol-fixture: "true"}}
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: app
          securityContext: {readOnlyRootFilesystem: true, allowPrivilegeEscalation: false, capabilities: {drop: [ALL]}}
          image: busybox:1.36
          command: ["sh", "-c", "sleep 3600"]
          readinessProbe: {exec: {command: ["false"]}, periodSeconds: 1}
