apiVersion: apps/v1
kind: Deployment
metadata:
  name: fixture-restarts-fail
  namespace: opencitadel-patrol-demo
  labels: {opencitadel.io/patrol-fixture: "true", opencitadel.io/restart-target: "11"}
spec:
  replicas: 1
  selector: {matchLabels: {app: fixture-restarts-fail}}
  template:
    metadata: {labels: {app: fixture-restarts-fail, opencitadel.io/patrol-fixture: "true"}}
    spec:
      containers:
        - {name: restart-01, image: busybox:1.36, command: ["sh", "-c", "exit 1"]}
        - {name: restart-02, image: busybox:1.36, command: ["sh", "-c", "exit 1"]}
        - {name: restart-03, image: busybox:1.36, command: ["sh", "-c", "exit 1"]}
        - {name: restart-04, image: busybox:1.36, command: ["sh", "-c", "exit 1"]}
        - {name: restart-05, image: busybox:1.36, command: ["sh", "-c", "exit 1"]}
        - {name: restart-06, image: busybox:1.36, command: ["sh", "-c", "exit 1"]}
        - {name: restart-07, image: busybox:1.36, command: ["sh", "-c", "exit 1"]}
        - {name: restart-08, image: busybox:1.36, command: ["sh", "-c", "exit 1"]}
        - {name: restart-09, image: busybox:1.36, command: ["sh", "-c", "exit 1"]}
        - {name: restart-10, image: busybox:1.36, command: ["sh", "-c", "exit 1"]}
        - {name: restart-11, image: busybox:1.36, command: ["sh", "-c", "exit 1"]}
