apiVersion: apps/v1
kind: Deployment
metadata:
  name: fixture-crashloop
  namespace: opencitadel-patrol-demo
  labels: {opencitadel.io/patrol-fixture: "true"}
spec:
  replicas: 1
  selector: {matchLabels: {app: fixture-crashloop}}
  template:
    metadata: {labels: {app: fixture-crashloop, opencitadel.io/patrol-fixture: "true"}}
    spec:
      containers:
        # Multiple bounded crashers make the aggregate restart threshold
        # deterministic without waiting for kubelet's exponential backoff.
        - {name: crash-01, image: busybox:1.36, command: ["sh", "-c", "echo crash >&2; exit 1"]}
        - {name: crash-02, image: busybox:1.36, command: ["sh", "-c", "echo crash >&2; exit 1"]}
        - {name: crash-03, image: busybox:1.36, command: ["sh", "-c", "echo crash >&2; exit 1"]}
        - {name: crash-04, image: busybox:1.36, command: ["sh", "-c", "echo crash >&2; exit 1"]}
        - {name: crash-05, image: busybox:1.36, command: ["sh", "-c", "echo crash >&2; exit 1"]}
        - {name: crash-06, image: busybox:1.36, command: ["sh", "-c", "echo crash >&2; exit 1"]}
        - {name: crash-07, image: busybox:1.36, command: ["sh", "-c", "echo crash >&2; exit 1"]}
        - {name: crash-08, image: busybox:1.36, command: ["sh", "-c", "echo crash >&2; exit 1"]}
        - {name: crash-09, image: busybox:1.36, command: ["sh", "-c", "echo crash >&2; exit 1"]}
        - {name: crash-10, image: busybox:1.36, command: ["sh", "-c", "echo crash >&2; exit 1"]}
        - {name: crash-11, image: busybox:1.36, command: ["sh", "-c", "echo crash >&2; exit 1"]}
