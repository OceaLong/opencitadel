# OpenCitadel sandbox egress policy.
#
# Sandboxes live on an internal Docker network with no default Internet
# gateway. This proxy is the sole dual-homed egress path and resolves the
# destination before applying the address ACLs below.
http_port 3128
visible_hostname opencitadel-sandbox-egress

acl CONNECT method CONNECT
acl Safe_ports port 80
acl Safe_ports port 443
acl Safe_ports port 8080
acl Safe_ports port 8443
acl SSL_ports port 443
acl SSL_ports port 8443

acl blocked_names dstdomain .localhost .local .internal
acl blocked_names dstdomain metadata metadata.google.internal instance-data
acl blocked_dst dst 0.0.0.0/8
acl blocked_dst dst 10.0.0.0/8
acl blocked_dst dst 100.64.0.0/10
acl blocked_dst dst 127.0.0.0/8
acl blocked_dst dst 169.254.0.0/16
acl blocked_dst dst 172.16.0.0/12
acl blocked_dst dst 192.0.0.0/24
acl blocked_dst dst 192.0.2.0/24
acl blocked_dst dst 192.168.0.0/16
acl blocked_dst dst 198.18.0.0/15
acl blocked_dst dst 198.51.100.0/24
acl blocked_dst dst 203.0.113.0/24
acl blocked_dst dst 224.0.0.0/4
acl blocked_dst dst 240.0.0.0/4
acl blocked_dst dst ::/128
acl blocked_dst dst ::1/128
acl blocked_dst dst 64:ff9b:1::/48
acl blocked_dst dst 100::/64
acl blocked_dst dst 2001:db8::/32
acl blocked_dst dst fc00::/7
acl blocked_dst dst fe80::/10
acl blocked_dst dst ff00::/8

http_access deny !Safe_ports
http_access deny CONNECT !SSL_ports
http_access deny blocked_names
http_access deny blocked_dst
http_access allow all
http_access deny all

cache deny all
forwarded_for delete
via off
request_header_access X-Forwarded-For deny all
# Logging to /dev/stdout or /dev/stderr fails under some container
# runtimes: after Squid drops privileges to cache_effective_user (proxy),
# it can lack permission to open the container's stdout/stderr pipe
# (observed under Docker Desktop). Log to the read-write tmpfs mounted at
# /var/log/squid instead - portable across runtimes and does not change
# the egress ACL policy below.
access_log /var/log/squid/access.log
cache_log /var/log/squid/cache.log
pid_filename /tmp/squid.pid
coredump_dir /tmp
