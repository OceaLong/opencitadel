# Bearer token the streamable-http endpoint requires. The process refuses to
# start without a strong value (>= 32 chars); operators MUST override this
# placeholder (e.g. via a kustomize secret patch or a sealed secret) before
# deploying. Callers connect with `Authorization: Bearer <token>`.
apiVersion: v1
kind: Secret
metadata:
  name: opencitadel-ops-collector-secret
type: Opaque
stringData:
  OPS_COLLECTOR_TOKEN: ""
