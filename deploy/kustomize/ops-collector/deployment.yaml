apiVersion: apps/v1
kind: Deployment
metadata:
  name: opencitadel-ops-collector
  labels:
    app.kubernetes.io/name: opencitadel-ops-collector
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: opencitadel-ops-collector
  template:
    metadata:
      labels:
        app.kubernetes.io/name: opencitadel-ops-collector
    spec:
      serviceAccountName: opencitadel-ops-collector
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: collector
          image: opencitadel-ops-collector:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: mcp
              containerPort: 8090
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          env:
            - name: OPS_COLLECTOR_TARGET_REF
              value: opencitadel-local
            - name: OPS_COLLECTOR_ALLOWED_NAMESPACES
              value: '["opencitadel"]'
            - name: OPS_COLLECTOR_TRANSPORT
              value: streamable-http
            - name: OPS_COLLECTOR_TOKEN
              valueFrom:
                secretKeyRef:
                  name: opencitadel-ops-collector-secret
                  key: OPS_COLLECTOR_TOKEN
          readinessProbe:
            tcpSocket:
              port: mcp
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: mcp
            initialDelaySeconds: 20
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 32Mi
