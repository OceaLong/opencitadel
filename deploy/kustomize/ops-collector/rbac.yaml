apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: opencitadel-ops-collector-readonly
rules:
  - apiGroups: [""]
    resources: ["pods", "pods/log", "events", "services", "persistentvolumeclaims", "nodes"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apps"]
    resources: ["deployments", "statefulsets", "daemonsets", "replicasets"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["batch"]
    resources: ["jobs", "cronjobs"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: opencitadel-ops-collector-readonly
subjects:
  - kind: ServiceAccount
    name: opencitadel-ops-collector
    namespace: opencitadel
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: opencitadel-ops-collector-readonly
