apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: opencitadel-ops-actuator
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: opencitadel-ops-actuator
  policyTypes: ["Ingress", "Egress"]
  ingress:
    - from:
        - podSelector:
            matchExpressions:
              - key: app.kubernetes.io/component
                operator: In
                values: ["api", "worker"]
      ports:
        - protocol: TCP
          port: 8091
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - {protocol: UDP, port: 53}
        - {protocol: TCP, port: 53}
    # Only the Kubernetes API server -- the actuator never talks to
    # Postgres/Redis/MinIO/Prometheus, unlike the read-only Collector.
    # Allow both the Service port (443) and the common control-plane endpoint
    # port (6443): NetworkPolicy implementations may evaluate egress after
    # Service DNAT, as kind does. Keeping any other ports open on a
    # write-scoped ServiceAccount's pod would add lateral-movement surface.
    - ports:
        - {protocol: TCP, port: 443}
        - {protocol: TCP, port: 6443}
