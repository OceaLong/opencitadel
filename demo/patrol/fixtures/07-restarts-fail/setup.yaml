apiVersion: apps/v1
kind: Deployment
metadata:
  name: fixture-restarts-fail
  namespace: opencitadel-patrol-demo
  labels: {opencitadel.io/patrol-fixture: "true", opencitadel.io/restart-target: "11"}
spec:
  replicas: 1
  selector: {matchLabels: {app: fixture-restarts-fail}}
  template:
    metadata: {labels: {app: fixture-restarts-fail, opencitadel.io/patrol-fixture: "true"}}
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile: {type: RuntimeDefault}
      containers:
        - {name: restart-01, securityContext: {readOnlyRootFilesystem: true, allowPrivilegeEscalation: false, capabilities: {drop: [ALL]}}, image: busybox:1.36, command: ["sh", "-c", "exit 1"]}
        - {name: restart-02, securityContext: {readOnlyRootFilesystem: true, allowPrivilegeEscalation: false, capabilities: {drop: [ALL]}}, image: busybox:1.36, command: ["sh", "-c", "exit 1"]}
        - {name: restart-03, securityContext: {readOnlyRootFilesystem: true, allowPrivilegeEscalation: false, capabilities: {drop: [ALL]}}, image: busybox:1.36, command: ["sh", "-c", "exit 1"]}
        - {name: restart-04, securityContext: {readOnlyRootFilesystem: true, allowPrivilegeEscalation: false, capabilities: {drop: [ALL]}}, image: busybox:1.36, command: ["sh", "-c", "exit 1"]}
        - {name: restart-05, securityContext: {readOnlyRootFilesystem: true, allowPrivilegeEscalation: false, capabilities: {drop: [ALL]}}, image: busybox:1.36, command: ["sh", "-c", "exit 1"]}
        - {name: restart-06, securityContext: {readOnlyRootFilesystem: true, allowPrivilegeEscalation: false, capabilities: {drop: [ALL]}}, image: busybox:1.36, command: ["sh", "-c", "exit 1"]}
        - {name: restart-07, securityContext: {readOnlyRootFilesystem: true, allowPrivilegeEscalation: false, capabilities: {drop: [ALL]}}, image: busybox:1.36, command: ["sh", "-c", "exit 1"]}
        - {name: restart-08, securityContext: {readOnlyRootFilesystem: true, allowPrivilegeEscalation: false, capabilities: {drop: [ALL]}}, image: busybox:1.36, command: ["sh", "-c", "exit 1"]}
        - {name: restart-09, securityContext: {readOnlyRootFilesystem: true, allowPrivilegeEscalation: false, capabilities: {drop: [ALL]}}, image: busybox:1.36, command: ["sh", "-c", "exit 1"]}
        - {name: restart-10, securityContext: {readOnlyRootFilesystem: true, allowPrivilegeEscalation: false, capabilities: {drop: [ALL]}}, image: busybox:1.36, command: ["sh", "-c", "exit 1"]}
        - {name: restart-11, securityContext: {readOnlyRootFilesystem: true, allowPrivilegeEscalation: false, capabilities: {drop: [ALL]}}, image: busybox:1.36, command: ["sh", "-c", "exit 1"]}
