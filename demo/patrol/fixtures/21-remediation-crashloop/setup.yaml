apiVersion: apps/v1
kind: Deployment
metadata:
  name: fixture-remediation-crashloop
  namespace: opencitadel-patrol-demo
  labels: {opencitadel.io/patrol-fixture: "true"}
spec:
  replicas: 1
  selector: {matchLabels: {app: fixture-remediation-crashloop}}
  template:
    metadata: {labels: {app: fixture-remediation-crashloop, opencitadel.io/patrol-fixture: "true"}}
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile: {type: RuntimeDefault}
      containers:
        # Mirrors 03-crashloop's bounded crashers: the aggregate restart
        # threshold is deterministic without waiting for kubelet's
        # exponential backoff. The actuator's remediation restart() patches
        # this same Deployment (spec.template annotations), not the crash
        # command itself -- the recheck-pass expectation in expected.json
        # models a successful redeploy of a fixed image, not a real self-
        # heal of this literal crash loop.
        - {name: crash-01, securityContext: {readOnlyRootFilesystem: true, allowPrivilegeEscalation: false, capabilities: {drop: [ALL]}}, image: busybox:1.36, command: ["sh", "-c", "echo crash >&2; exit 1"]}
        - {name: crash-02, securityContext: {readOnlyRootFilesystem: true, allowPrivilegeEscalation: false, capabilities: {drop: [ALL]}}, image: busybox:1.36, command: ["sh", "-c", "echo crash >&2; exit 1"]}
        - {name: crash-03, securityContext: {readOnlyRootFilesystem: true, allowPrivilegeEscalation: false, capabilities: {drop: [ALL]}}, image: busybox:1.36, command: ["sh", "-c", "echo crash >&2; exit 1"]}
        - {name: crash-04, securityContext: {readOnlyRootFilesystem: true, allowPrivilegeEscalation: false, capabilities: {drop: [ALL]}}, image: busybox:1.36, command: ["sh", "-c", "echo crash >&2; exit 1"]}
        - {name: crash-05, securityContext: {readOnlyRootFilesystem: true, allowPrivilegeEscalation: false, capabilities: {drop: [ALL]}}, image: busybox:1.36, command: ["sh", "-c", "echo crash >&2; exit 1"]}
        - {name: crash-06, securityContext: {readOnlyRootFilesystem: true, allowPrivilegeEscalation: false, capabilities: {drop: [ALL]}}, image: busybox:1.36, command: ["sh", "-c", "echo crash >&2; exit 1"]}
        - {name: crash-07, securityContext: {readOnlyRootFilesystem: true, allowPrivilegeEscalation: false, capabilities: {drop: [ALL]}}, image: busybox:1.36, command: ["sh", "-c", "echo crash >&2; exit 1"]}
        - {name: crash-08, securityContext: {readOnlyRootFilesystem: true, allowPrivilegeEscalation: false, capabilities: {drop: [ALL]}}, image: busybox:1.36, command: ["sh", "-c", "echo crash >&2; exit 1"]}
        - {name: crash-09, securityContext: {readOnlyRootFilesystem: true, allowPrivilegeEscalation: false, capabilities: {drop: [ALL]}}, image: busybox:1.36, command: ["sh", "-c", "echo crash >&2; exit 1"]}
        - {name: crash-10, securityContext: {readOnlyRootFilesystem: true, allowPrivilegeEscalation: false, capabilities: {drop: [ALL]}}, image: busybox:1.36, command: ["sh", "-c", "echo crash >&2; exit 1"]}
        - {name: crash-11, securityContext: {readOnlyRootFilesystem: true, allowPrivilegeEscalation: false, capabilities: {drop: [ALL]}}, image: busybox:1.36, command: ["sh", "-c", "echo crash >&2; exit 1"]}
