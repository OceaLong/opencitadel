[project]
name = "opencitadel-ops-actuator"
version = "0.1.0"
description = "Bounded, registered-write MCP actions for OpenCitadel Ops Patrol remediation"
requires-python = ">=3.12,<3.13"
dependencies = [
  "kubernetes>=31.0.0",
  "mcp>=1.22.0,<2",
  "pydantic>=2.11.7",
  "pydantic-settings>=2.10.1",
]

[project.scripts]
opencitadel-ops-actuator = "opencitadel_ops_actuator.main:main"

[dependency-groups]
dev = ["pytest>=8.4.1", "pytest-asyncio>=1.0.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/opencitadel_ops_actuator"]

[tool.pytest.ini_options]
pythonpath = ["src"]
asyncio_mode = "auto"
testpaths = ["tests"]
