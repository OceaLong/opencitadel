[project]
name = "opencitadel-ops-collector"
version = "0.1.0"
description = "Bounded, read-only MCP probes for OpenCitadel Ops Patrol"
requires-python = ">=3.12,<3.13"
dependencies = [
  "httpx>=0.28.1",
  "kubernetes>=31.0.0",
  "mcp>=1.22.0,<3",
  "pydantic>=2.12.5",
  "pydantic-settings>=2.12.0",
]

[project.scripts]
opencitadel-ops-collector = "opencitadel_ops_collector.main:main"

[dependency-groups]
dev = ["pytest>=8.4.2", "pytest-asyncio>=1.0.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/opencitadel_ops_collector"]

[tool.pytest.ini_options]
pythonpath = ["src"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
markers = ["integration: requires an explicitly configured disposable environment"]
