<title id="title">Knowledge Base · Document revision states</title>
<desc id="desc">Document processing states are distinct from Build Run states and version publication. A parsed document is not production-readable; retrieval requires an indexed revision in a published closure. Partial document failure can publish a degraded version only when mandatory retrievable content remains.</desc>
