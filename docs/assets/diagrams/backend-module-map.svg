<title id="title">Backend · Module and composition boundaries</title>
<desc id="desc">Processes construct their own object graph; HTTP dependencies resolve services from app.state. Domain never imports application or infrastructure; application code depends on ports rather than adapters. alembic/versions contains one 0001greenfield → 0030evaluation_judge_history lineage for fresh databases.</desc>
