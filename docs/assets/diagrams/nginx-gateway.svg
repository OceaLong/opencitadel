<title id="title">Nginx · Gateway routing</title>
<desc id="desc">The host listener is distinct from the container listener; backend processes remain internal. SSE responses disable buffering; sandbox VNC WebSocket traffic uses the API proxy with upgrade headers. Internal DNS is resolved dynamically; provider egress and kernel work do not run through the UI gateway.</desc>
