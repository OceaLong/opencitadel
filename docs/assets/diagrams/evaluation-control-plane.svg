<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1020" viewBox="0 0 1440 1020" data-generator="fireworks-tech-graph" data-quality-profile="showcase" role="img" aria-labelledby="title desc">
<title id="title">OpenCitadel · Evaluation control plane</title>
<desc id="desc">Subject and Judge execution reuse the kernel; evaluation records do not create a second Run lifecycle. Judge calls pass the same physical budget authority. Closing a namespace never clears an unknown-call hold. Only automatic scoring defers a verified forward projection race; other stale or unauthorized candidates still fail.</desc>
