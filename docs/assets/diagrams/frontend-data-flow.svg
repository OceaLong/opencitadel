<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1020" viewBox="0 0 1440 1020" data-generator="fireworks-tech-graph" data-quality-profile="showcase" role="img" aria-labelledby="title desc">
<title id="title">OpenCitadel · Frontend data flow</title>
<desc id="desc">The browser owns presentation and request state; server projections own execution meaning. Workspace / identity changes invalidate prior generations. Late responses cannot populate the new scope. Analysis and export preserve server capture identities. Feed cursors are not parsed or used as playback cuts.</desc>
