<title id="title">Ops Patrol · Read, validation and evidence</title>
<desc id="desc">A versioned Pack admits a Patrol Run; fixed Collector probes never authorize Kubernetes writes. Scheduled Pack firings use an Automation parent linked to this Patrol child; manual runs use direct admission. Evidence export contains its verification result; a signed package alone does not prove a valid source chain.</desc>
