<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1010" viewBox="0 0 1440 1010" data-generator="fireworks-tech-graph" data-quality-profile="showcase" role="img" aria-labelledby="title desc">
<title id="title">Automation · Trigger and execution flow</title>
<desc id="desc">Redis leases coordinate scheduled polling; PostgreSQL persists each accepted firing and its Run. Manual and signed webhook triggers invoke ScheduledJobService directly; they do not wait for the cron lease. Leases reduce duplicate polling. Database locks and idempotency remain authoritative for accepted work.</desc>
