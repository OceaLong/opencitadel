<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1020" viewBox="0 0 1440 1020" data-generator="fireworks-tech-graph" data-quality-profile="showcase" role="img" aria-labelledby="title desc">
<title id="title">OpenCitadel · Runtime topology</title>
<desc id="desc">One execution authority; evaluation extends the control plane without adding a Run family. Redis wake-ups are post-commit hints. Lost notifications are recovered by PostgreSQL polling. Activity progress also feeds the observation journal and public feed; it cannot create a Run terminal event.</desc>
<style>text { font-family: Helvetica, Arial, sans-serif; fill: #111827; } .secondary { fill: #6b7280; }</style>
