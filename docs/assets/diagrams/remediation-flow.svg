<title id="title">Ops Patrol · Approved remediation</title>
<desc id="desc">A proposal starts a linked remediation Run; human approval is persisted before the external mutation. Rejection, cancellation, failed verification and unknown external outcomes remain separate protocol states. A current remediation-key annotation supports duplicate detection; it is not a global exactly-once ledger.</desc>
