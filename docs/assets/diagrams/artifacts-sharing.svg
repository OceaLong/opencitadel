<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="740" viewBox="0 0 1440 740" data-generator="fireworks-tech-graph" data-quality-profile="showcase" role="img" aria-labelledby="title desc">
<title id="title">OpenCitadel · Artifact versions and sharing</title>
<desc id="desc">Private historical content and live public share links have different evidence boundaries. Execution content binds an explicit artifact version to Run / Step / at, with bounded content pages. Public sharing serves current content. It is not an immutable Run replay, analysis source or export capture.</desc>
