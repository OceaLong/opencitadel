<title id="title">Teams · Server-side workspace scope</title>
<desc id="desc">Workspace headers select a scope; authenticated membership and database authorization decide access. Current membership remains mandatory for historical captures, comparisons, exports and evaluation work. Personal ownership and team ownership are mutually exclusive; global roles do not erase stream scope.</desc>
