<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="740" viewBox="0 0 1440 740" data-generator="fireworks-tech-graph" data-quality-profile="showcase" role="img" aria-labelledby="title desc">
<title id="title">Runtime Policy · Revision, head and consumers</title>
<desc id="desc">A mutation activates an immutable revision under CAS; each process verifies the atomic policy pair. Redis publishes refresh hints after commit; a lost hint never changes the PostgreSQL policy head. Transient storage loss may use a verified bounded cache, while readiness reports policy unavailable.</desc>
