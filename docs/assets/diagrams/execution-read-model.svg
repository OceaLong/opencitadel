<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1020" viewBox="0 0 1440 1020" data-generator="fireworks-tech-graph" data-quality-profile="showcase" role="img" aria-labelledby="title desc">
<title id="title">OpenCitadel · Execution read model</title>
<desc id="desc">Formal lifecycle facts and display telemetry remain distinct at every historical boundary. Public SSE uses its own opaque feed sequence cursor. A feed cursor is never a playback boundary. Incomplete, expired or unauthorized captures fail explicitly; raw provider input is not a public read model.</desc>
