<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1020" viewBox="0 0 1440 1020" data-generator="fireworks-tech-graph" data-quality-profile="showcase" role="img" aria-labelledby="title desc">
<title id="title">Ops Actuator · Validation, deduplication and patch</title>
<desc id="desc">Current-marker duplicate detection precedes writes; it does not promise global exactly-once execution. get_capabilities is a separate read-only tool exposing tool/schema hashes, not a remediation mutation. A later key replaces the annotation. Old-key replay or concurrent callers cannot rely on a history ledger.</desc>
