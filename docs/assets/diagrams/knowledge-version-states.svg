<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1020" viewBox="0 0 1440 1020" data-generator="fireworks-tech-graph" data-quality-profile="showcase" role="img" aria-labelledby="title desc">
<title id="title">Knowledge Base · Candidate version outcomes</title>
<desc id="desc">Version states describe the published product; they do not replace the execution protocol. Ready and degraded publication validates the immutable manifest and advances the active pointer under CAS. Failed or cancelled candidates preserve the active version; retry creates a new candidate from its manifest.</desc>
<style>text { font-family: Helvetica, Arial, sans-serif; fill: #111827; } .secondary { fill: #6b7280; }</style>
