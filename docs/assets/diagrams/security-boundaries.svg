<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1290" viewBox="0 0 1440 1290" data-generator="fireworks-tech-graph" data-quality-profile="showcase" role="img" aria-labelledby="title desc">
<title id="title">OpenCitadel · Security boundaries</title>
<desc id="desc">Identity, scope, database roles, sandbox isolation and external effects are separate enforcement boundaries. Ops Collector and Actuator stay private and require bearer tokens plus narrow namespace/workload rules. Squid is a destination/port block policy, not a rendered hostname allowlist; model-call holds survive cleanup.</desc>
<style>text { font-family: Helvetica, Arial, sans-serif; fill: #111827; } .secondary { fill: #6b7280; }</style>
