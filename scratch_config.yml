name: opencitadel
services:
  acceptance-inference:
    profiles:
      - acceptance
    build:
      context: /Users/longhaiyang/code/agent/opencitadel/e2e/fixtures/inference-provider
      dockerfile: Dockerfile
      args:
        NPM_CONFIG_REGISTRY: https://registry.npmmirror.com
        PIP_DEFAULT_TIMEOUT: "300"
        PIP_INDEX_URL: https://mirrors.aliyun.com/pypi/simple/
        PIP_RETRIES: "5"
        PIP_TRUSTED_HOST: mirrors.aliyun.com
        PYPI_FILES_MIRROR: https://mirrors.aliyun.com/pypi/packages/
        UV_HTTP_TIMEOUT: "300"
        UV_INDEX_URL: https://mirrors.aliyun.com/pypi/simple/
        UV_VERSION: 0.11.33
    cap_drop:
      - ALL
    cpus: 0.25
    environment:
      ACCEPTANCE_PROVIDER_TOKEN: ""
    healthcheck:
      test:
        - CMD
        - wget
        - -q
        - -O
        - /dev/null
        - http://127.0.0.1:8080/healthz
      timeout: 3s
      interval: 5s
      retries: 12
    image: opencitadel-acceptance-inference
    labels:
      com.opencitadel.acceptance.project: none
      com.opencitadel.acceptance.run: none
    mem_limit: "134217728"
    networks:
      opencitadel-network: null
    pids_limit: 64
    read_only: true
    restart: 'no'
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:rw,nosuid,nodev,noexec,size=16m,mode=1777
    user: 1000:1000
  opencitadel-api:
    build:
      context: /Users/longhaiyang/code/agent/opencitadel/api
      dockerfile: Dockerfile
      args:
        NPM_CONFIG_REGISTRY: https://registry.npmmirror.com
        PIP_DEFAULT_TIMEOUT: "300"
        PIP_INDEX_URL: https://mirrors.aliyun.com/pypi/simple/
        PIP_RETRIES: "5"
        PIP_TRUSTED_HOST: mirrors.aliyun.com
        PYPI_FILES_MIRROR: https://mirrors.aliyun.com/pypi/packages/
        UV_HTTP_TIMEOUT: "300"
        UV_INDEX_URL: https://mirrors.aliyun.com/pypi/simple/
        UV_VERSION: 0.11.33
        WITH_K8S: "0"
      target: api
    cpus: 2
    depends_on:
      opencitadel-migrate:
        condition: service_completed_successfully
        required: true
      opencitadel-postgres:
        condition: service_healthy
        required: true
      opencitadel-redis:
        condition: service_healthy
        required: true
      opencitadel-sandbox-broker:
        condition: service_healthy
        required: true
    environment:
      ACCESS_TOKEN_TTL_SECONDS: "900"
      API_KEY_PREVIOUS_SECRETS: '{}'
      API_KEY_SECRET: REDACTED_API_KEY_SECRET
      API_KEY_SECRET_ID: primary
      AUDIT_PREVIOUS_SIGNING_KEYS: '{}'
      AUDIT_SIGNING_KEY: replace-with-openssl-rand-hex-32
      AUDIT_SIGNING_KEY_ID: primary
      BOOTSTRAP_ADMIN_EMAIL: admin@example.com
      BOOTSTRAP_ADMIN_PASSWORD: replace-with-strong-admin-password
      COMPOSE_PROFILES: ""
      COMPOSE_PROJECT_NAME: opencitadel
