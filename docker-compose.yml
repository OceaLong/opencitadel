# 构建期镜像源（可通过 .env 或环境变量覆盖）
x-pip-build-args: &pip-build-args
  PIP_INDEX_URL: ${PIP_INDEX_URL:-https://mirrors.aliyun.com/pypi/simple/}
  PIP_TRUSTED_HOST: ${PIP_TRUSTED_HOST:-mirrors.aliyun.com}
  PIP_DEFAULT_TIMEOUT: ${PIP_DEFAULT_TIMEOUT:-300}
  PIP_RETRIES: ${PIP_RETRIES:-5}
  UV_INDEX_URL: ${UV_INDEX_URL:-https://mirrors.aliyun.com/pypi/simple/}
  UV_VERSION: ${UV_VERSION:-0.11.33}
  UV_HTTP_TIMEOUT: ${UV_HTTP_TIMEOUT:-300}
  PYPI_FILES_MIRROR: ${PYPI_FILES_MIRROR-https://mirrors.aliyun.com/pypi/packages/}
  NPM_CONFIG_REGISTRY: ${NPM_CONFIG_REGISTRY:-https://registry.npmmirror.com}

x-ownership-labels: &ownership-labels
  com.opencitadel.acceptance.project: ${ACCEPTANCE_PROJECT_ID:-none}
  com.opencitadel.acceptance.run: ${ACCEPTANCE_RUN_ID:-none}

services:
  # ==================== 基础设施 ====================

  opencitadel-redis:
    labels: *ownership-labels
    security_opt:
      - no-new-privileges:true
    image: redis:7-alpine
    restart: unless-stopped
    mem_limit: 512m
    mem_reservation: 256m
    cpus: "0.50"
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
    command:
      - sh
      - -c
      - >-
        exec redis-server --appendonly yes --maxmemory 256mb
        --maxmemory-policy allkeys-lru
        $${REDIS_PASSWORD:+--requirepass "$${REDIS_PASSWORD}"}
    volumes:
      - redis_data:/data
    networks:
      - opencitadel-network
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          if [ -n "$$REDIS_PASSWORD" ]; then
            redis-cli --no-auth-warning -a "$$REDIS_PASSWORD" ping;
          else redis-cli ping; fi
      interval: 10s
      timeout: 5s
      retries: 5

  opencitadel-postgres:
    labels: *ownership-labels
    security_opt:
      - no-new-privileges:true
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    mem_limit: 1024m
    mem_reservation: 512m
    cpus: "1.50"
    environment:
      POSTGRES_USER: ${POSTGRES_ADMIN_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_ADMIN_PASSWORD:?POSTGRES_ADMIN_PASSWORD must be set}
      POSTGRES_DB: ${POSTGRES_DB:-opencitadel}
      OPENCITADEL_APP_USER: ${POSTGRES_USER:-opencitadel_app}
      OPENCITADEL_APP_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
      OPENCITADEL_MIGRATION_USER: ${POSTGRES_MIGRATION_USER:-opencitadel_migration_runtime}
      OPENCITADEL_MIGRATION_PASSWORD: ${POSTGRES_MIGRATION_PASSWORD:?POSTGRES_MIGRATION_PASSWORD must be set}
      OPENCITADEL_KERNEL_USER: ${POSTGRES_KERNEL_USER:-opencitadel_execution_kernel_runtime}
      OPENCITADEL_KERNEL_PASSWORD: ${POSTGRES_KERNEL_PASSWORD:?POSTGRES_KERNEL_PASSWORD must be set}
    command:
      - postgres
      - -c
      - shared_buffers=256MB
      - -c
      - effective_cache_size=768MB
      - -c
      - work_mem=8MB
      - -c
      - maintenance_work_mem=64MB
      - -c
      - max_connections=100
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./deploy/helm/opencitadel/files/postgres/init-app-role.sh:/docker-entrypoint-initdb.d/10-opencitadel-app-role.sh:ro
    networks:
      - opencitadel-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_ADMIN_USER:-postgres} -d ${POSTGRES_DB:-opencitadel}"]
      interval: 10s
      timeout: 5s
      retries: 5

  opencitadel-minio:
    labels: *ownership-labels
    profiles:
      - local
    image: minio/minio:latest
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    mem_limit: 512m
    mem_reservation: 256m
    cpus: "0.50"
    command: server /data
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-minioadmin}
    volumes:
      - minio_data:/data
    networks:
      - opencitadel-network
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ==================== 沙箱服务 ====================

  opencitadel-sandbox-egress:
    labels: *ownership-labels
    image: ubuntu/squid:6.6-24.04_edge
    restart: unless-stopped
    mem_limit: 256m
    mem_reservation: 128m
    cpus: "0.50"
    pids_limit: 128
    security_opt:
      - no-new-privileges:true
    volumes:
      - ./deploy/squid/squid.conf:/etc/squid/squid.conf:ro
    tmpfs:
      - /tmp:rw,nosuid,nodev,noexec,size=32m,mode=1777
      # mode=1777: squid drops privileges to the unprivileged "proxy" user
      # after startup; without an explicit mode these tmpfs mounts default
      # to root:root 0755 and squid cannot open its log files.
      - /var/log/squid:rw,nosuid,nodev,noexec,size=64m,mode=1777
      - /var/spool/squid:rw,nosuid,nodev,noexec,size=64m,mode=1777
    networks:
      - opencitadel-sandbox-network
      - opencitadel-egress-network
    healthcheck:
      # The stock ubuntu/squid rock image has no "pebble" binary (that's a
      # different family of Canonical rock images) and ships no built-in
      # healthcheck, so `pebble health` always exits 127 (command not
      # found) and the service can never report healthy. bash's /dev/tcp
      # is available in the image and needs no extra tooling (no curl,
      # wget, nc, or squidclient present) to confirm the proxy is accepting
      # connections.
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/3128"]
      interval: 15s
      timeout: 5s
      retries: 5

  opencitadel-sandbox:
    labels: *ownership-labels
    profiles:
      - fixed-sandbox
    build:
      context: ./sandbox
      dockerfile: Dockerfile
      args:
        <<: *pip-build-args
    image: opencitadel-sandbox
    restart: "no"
    mem_limit: 1g
    memswap_limit: 1g
    cpus: "2.00"
    pids_limit: 512
    user: "1000:1000"
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    environment:
      HTTP_PROXY: http://opencitadel-sandbox-egress:3128
      HTTPS_PROXY: http://opencitadel-sandbox-egress:3128
      NO_PROXY: localhost,127.0.0.1
      http_proxy: http://opencitadel-sandbox-egress:3128
      https_proxy: http://opencitadel-sandbox-egress:3128
      no_proxy: localhost,127.0.0.1
      CHROME_ARGS: --proxy-server=http://opencitadel-sandbox-egress:3128
    tmpfs:
      - /tmp:rw,nosuid,nodev,noexec,size=256m,mode=1777
      - /run:rw,nosuid,nodev,noexec,size=32m,mode=0755
      - /home/ubuntu:rw,nosuid,nodev,size=768m,uid=1000,gid=1000,mode=0700
    networks:
      - opencitadel-sandbox-network
    depends_on:
      opencitadel-sandbox-egress:
        condition: service_healthy
    healthcheck:
      # curl is present in the sandbox image (installed in sandbox/Dockerfile).
      # Every /api/* route is gated by a fail-closed Bearer-token middleware
      # (sandbox/app/core/middleware.py), and this fixed-sandbox profile injects
      # no SANDBOX_ACCESS_TOKEN, so an unauthenticated probe to
      # /api/supervisor/status returns 401/503 and can never report healthy.
      # FastAPI's own /openapi.json is served outside the /api prefix, needs no
      # token, and returning it confirms the ASGI app is up and handling
      # requests (a stronger signal than a raw TCP connect).
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://127.0.0.1:8080/openapi.json"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  # The only service allowed to access Docker. It receives no database,
  # provider, OAuth, or application secrets and exposes a narrow token-
  # authenticated sandbox lifecycle API on the internal network.
  opencitadel-sandbox-broker:
    labels: *ownership-labels
    build:
      context: ./api
      dockerfile: Dockerfile
      target: api
      args:
        <<: *pip-build-args
        # 与 opencitadel-api 共享同一 image:opencitadel-api 标签,build args 必须保持一致,
        # 否则镜像内容取决于哪个服务先触发构建;broker 只 import docker、driver 硬编码为
        # "docker"(app/infrastructure/external/sandbox/broker.py),任何场景都不需要 kubernetes SDK
        WITH_K8S: "0"
    image: opencitadel-api
    restart: unless-stopped
    command: ["python", "-m", "app.infrastructure.external.sandbox.broker"]
    mem_limit: 256m
    mem_reservation: 128m
    cpus: "0.50"
    pids_limit: 128
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    # api/Dockerfile now runs as non-root uid 10001 (appuser). This is the
    # only api-image service that needs the host Docker socket. Add the
    # socket's group as a supplementary group so appuser can reach it
    # without granting root to the process itself (cap_drop: ALL, read_only,
    # no-new-privileges all remain in effect). Default 0 matches Docker
    # Desktop, where the socket is root:root; on native Linux hosts the
    # socket is typically root:docker with a host-specific gid, so set
    # DOCKER_SOCK_GID accordingly (see .env.example).
    group_add:
      - "${DOCKER_SOCK_GID:-0}"
    environment:
      SANDBOX_BROKER_TOKEN: ${SANDBOX_BROKER_TOKEN:?SANDBOX_BROKER_TOKEN must be set}
      SANDBOX_IMAGE: ${SANDBOX_IMAGE:-opencitadel-sandbox}
      SANDBOX_NAME_PREFIX: ${SANDBOX_NAME_PREFIX:-opencitadel-sandbox}
      SANDBOX_NETWORK: ${SANDBOX_NETWORK:-${COMPOSE_PROJECT_NAME:-opencitadel}_opencitadel-sandbox-network}
      SANDBOX_LABELS: >-
        ${SANDBOX_LABELS:-{}}
      SANDBOX_HTTP_PROXY: http://opencitadel-sandbox-egress:3128
      SANDBOX_HTTPS_PROXY: http://opencitadel-sandbox-egress:3128
      SANDBOX_NO_PROXY: localhost,127.0.0.1
      SANDBOX_CHROME_ARGS: --proxy-server=http://opencitadel-sandbox-egress:3128
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    tmpfs:
      - /tmp:rw,nosuid,nodev,noexec,size=64m,mode=1777
    networks:
      - opencitadel-network
    depends_on:
      opencitadel-sandbox-egress:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8090/healthz"]
      interval: 15s
      timeout: 5s
      retries: 5

  # ==================== 数据库迁移 (一次性) ====================

  opencitadel-migrate:
    labels: *ownership-labels
    security_opt:
      - no-new-privileges:true
    build:
      context: ./api
      dockerfile: Dockerfile
      target: api
      args:
        <<: *pip-build-args
        # 本地 compose 使用 docker 驱动沙箱,不需要 kubernetes SDK;CI/发布构建不传此参数,默认 1(全功能)
        WITH_K8S: "0"
    image: opencitadel-migrate
    mem_limit: 512m
    env_file:
      - ${OPENCITADEL_ENV_FILE:-.env}
    environment:
      POSTGRES_ADMIN_USER: ${POSTGRES_MIGRATION_USER:-opencitadel_migration_runtime}
      POSTGRES_ADMIN_PASSWORD: ${POSTGRES_MIGRATION_PASSWORD:?POSTGRES_MIGRATION_PASSWORD must be set}
    depends_on:
      opencitadel-postgres:
        condition: service_healthy
    networks:
      - opencitadel-network
    command: ["python", "-m", "app.migrate"]
    restart: "no"

  # ==================== 后端 API ====================

  opencitadel-api:
    labels: *ownership-labels
    security_opt:
      - no-new-privileges:true
    build:
      context: ./api
      dockerfile: Dockerfile
      target: api
      args:
        <<: *pip-build-args
        # 本地 compose 使用 docker 驱动沙箱,不需要 kubernetes SDK;CI/发布构建不传此参数,默认 1(全功能)
        WITH_K8S: "0"
    image: opencitadel-api
    restart: unless-stopped
    stop_grace_period: 45s
    mem_limit: 640m
    mem_reservation: 384m
    cpus: "2.00"
    env_file:
      - ${OPENCITADEL_ENV_FILE:-.env}
    environment:
      POSTGRES_ADMIN_USER: ""
      POSTGRES_ADMIN_PASSWORD: ""
      POSTGRES_MIGRATION_USER: ""
      POSTGRES_MIGRATION_PASSWORD: ""
      POSTGRES_KERNEL_USER: ""
      POSTGRES_KERNEL_PASSWORD: ""
      SANDBOX_BROKER_URL: http://opencitadel-sandbox-broker:8090
      SANDBOX_BROKER_TOKEN: ${SANDBOX_BROKER_TOKEN:?SANDBOX_BROKER_TOKEN must be set}
      SANDBOX_IMAGE: ${SANDBOX_IMAGE:-opencitadel-sandbox}
      SANDBOX_NAME_PREFIX: ${SANDBOX_NAME_PREFIX:-opencitadel-sandbox}
      SANDBOX_NETWORK: ${SANDBOX_NETWORK:-${COMPOSE_PROJECT_NAME:-opencitadel}_opencitadel-sandbox-network}
      SANDBOX_LABELS: >-
        ${SANDBOX_LABELS:-{}}
      METRICS_TOKEN: ${METRICS_TOKEN:-}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      opencitadel-redis:
        condition: service_healthy
      opencitadel-postgres:
        condition: service_healthy
      opencitadel-migrate:
        condition: service_completed_successfully
      opencitadel-sandbox-broker:
        condition: service_healthy
    networks:
      - opencitadel-network
      - opencitadel-sandbox-network
      - opencitadel-ops-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8000/api/health/ready"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 20s

  # ==================== Universal Execution Kernel ====================

  opencitadel-execution-kernel:
    labels: *ownership-labels
    security_opt:
      - no-new-privileges:true
    build:
      context: ./api
      dockerfile: Dockerfile
      target: execution-kernel
      args:
        <<: *pip-build-args
        # 本地 compose 使用 docker 驱动沙箱,不需要 kubernetes SDK;CI/发布构建不传此参数,默认 1(全功能)
        WITH_K8S: "0"
    image: opencitadel-execution-kernel
    restart: unless-stopped
    stop_grace_period: 45s
    mem_limit: 1024m
    mem_reservation: 512m
    cpus: "2.00"
    env_file:
      - ${OPENCITADEL_ENV_FILE:-.env}
    environment:
      POSTGRES_USER: ${POSTGRES_KERNEL_USER:-opencitadel_execution_kernel_runtime}
      POSTGRES_PASSWORD: ${POSTGRES_KERNEL_PASSWORD:?POSTGRES_KERNEL_PASSWORD must be set}
      POSTGRES_ADMIN_USER: ""
      POSTGRES_ADMIN_PASSWORD: ""
      POSTGRES_MIGRATION_USER: ""
      POSTGRES_MIGRATION_PASSWORD: ""
      SANDBOX_BROKER_URL: http://opencitadel-sandbox-broker:8090
      SANDBOX_BROKER_TOKEN: ${SANDBOX_BROKER_TOKEN:?SANDBOX_BROKER_TOKEN must be set}
      SANDBOX_IMAGE: ${SANDBOX_IMAGE:-opencitadel-sandbox}
      SANDBOX_NAME_PREFIX: ${SANDBOX_NAME_PREFIX:-opencitadel-sandbox}
      SANDBOX_NETWORK: ${SANDBOX_NETWORK:-${COMPOSE_PROJECT_NAME:-opencitadel}_opencitadel-sandbox-network}
      SANDBOX_LABELS: >-
        ${SANDBOX_LABELS:-{}}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    expose:
      - "9108"
    depends_on:
      opencitadel-redis:
        condition: service_started
      opencitadel-postgres:
        condition: service_healthy
      opencitadel-migrate:
        condition: service_completed_successfully
      opencitadel-sandbox-broker:
        condition: service_healthy
    networks:
      - opencitadel-network
      - opencitadel-sandbox-network
      - opencitadel-ops-network
    command: ["python", "-m", "app.execution_kernel_main"]
    healthcheck:
      test: ["CMD", "python", "-m", "app.execution_kernel_health", "readiness"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  # ==================== 前端 UI ====================

  opencitadel-ui:
    labels: *ownership-labels
    security_opt:
      - no-new-privileges:true
    build:
      context: ./ui
      dockerfile: Dockerfile
      args:
        <<: *pip-build-args
        NEXT_PUBLIC_API_BASE_URL: /api
    image: opencitadel-ui
    restart: unless-stopped
    mem_limit: 384m
    mem_reservation: 192m
    cpus: "1.00"
    depends_on:
      opencitadel-api:
        condition: service_healthy
    networks:
      - opencitadel-network
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:3000/healthz"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  # Fixed, read-only MCP surface for Ops Patrol. Kubernetes deployments
  # should use the Helm/Kustomize ServiceAccount instead of this local profile.
  opencitadel-ops-collector:
    labels: *ownership-labels
    profiles:
      - patrol
    build:
      context: ./ops-collector
      dockerfile: Dockerfile
      args:
        <<: *pip-build-args
    image: opencitadel-ops-collector
    restart: unless-stopped
    user: "10001:10001"
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 256m
    mem_reservation: 128m
    cpus: "0.50"
    pids_limit: 128
    environment:
      OPS_COLLECTOR_TARGET_REF: ${OPS_COLLECTOR_TARGET_REF:-opencitadel-local}
      OPS_COLLECTOR_ALLOWED_NAMESPACES: '${OPS_COLLECTOR_ALLOWED_NAMESPACES:-["opencitadel"]}'
      OPS_COLLECTOR_TRANSPORT: streamable-http
      OPS_COLLECTOR_ALLOW_STDIO: "false"
      OPS_COLLECTOR_TOKEN: ${OPS_COLLECTOR_TOKEN:?set a strong OPS_COLLECTOR_TOKEN}
      OPS_COLLECTOR_HTTP_PROBES: >-
        ${OPS_COLLECTOR_HTTP_PROBES:-{"primary-endpoint":{"url":"http://opencitadel-api:8000/api/status","expected_statuses":[200]},"demo-console":{"url":"http://ops-console:9099/health","expected_statuses":[200]}}}
      OPS_COLLECTOR_DEPENDENCIES: >-
        ${OPS_COLLECTOR_DEPENDENCIES:-{"primary-dependencies":{"kind":"postgres","host":"opencitadel-postgres","port":5432},"demo-console-tcp":{"kind":"tcp","host":"ops-console","port":9099}}}
    tmpfs:
      - /tmp:rw,nosuid,nodev,noexec,size=32m,mode=1777
    # Callers (api + execution-kernel) reach the Collector over the dedicated
    # ops network. It stays on opencitadel-network as well because its probes
    # dial other compose services (api, postgres, ops-console); bearer-token
    # auth is the primary boundary for the read-only surface.
    networks:
      - opencitadel-ops-network
      - opencitadel-network
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; socket.create_connection(('127.0.0.1', 8090), 2).close()"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s

  # Narrow, write-scoped MCP surface for Ops Patrol Remediation. Kubernetes
  # deployments should use the Helm/Kustomize ServiceAccount instead of this
  # local profile. Disabled by default (opt-in "actuator" profile).
  opencitadel-ops-actuator:
    labels: *ownership-labels
    profiles:
      - actuator
    build:
      context: ./ops-actuator
      dockerfile: Dockerfile
      args:
        <<: *pip-build-args
    image: opencitadel-ops-actuator
    restart: unless-stopped
    user: "10001:10001"
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 256m
    mem_reservation: 128m
    cpus: "0.50"
    pids_limit: 128
    environment:
      OPS_ACTUATOR_TARGET_REF: ${OPS_ACTUATOR_TARGET_REF:-opencitadel-local}
      OPS_ACTUATOR_ALLOWED_NAMESPACES: '${OPS_ACTUATOR_ALLOWED_NAMESPACES:-["opencitadel"]}'
      OPS_ACTUATOR_TRANSPORT: streamable-http
      OPS_ACTUATOR_ALLOW_STDIO: "false"
      OPS_ACTUATOR_TOKEN: ${OPS_ACTUATOR_TOKEN:?set a strong OPS_ACTUATOR_TOKEN}
    tmpfs:
      - /tmp:rw,nosuid,nodev,noexec,size=32m,mode=1777
    # Reachable only over the dedicated ops network (api + execution-kernel).
    # The Actuator has no other compose-service dependency, so keeping it off
    # opencitadel-network removes it from the reach of every unrelated container.
    networks:
      - opencitadel-ops-network
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; socket.create_connection(('127.0.0.1', 8091), 2).close()"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s

  # ==================== Demo: OpsConsole 样板工单后台 ====================

  ops-console:
    labels: *ownership-labels
    security_opt:
      - no-new-privileges:true
    profiles:
      - demo
    build:
      context: ./demo/ops-console
      dockerfile: Dockerfile
      args:
        <<: *pip-build-args
    image: opencitadel-ops-console
    restart: unless-stopped
    mem_limit: 256m
    cpus: "0.50"
    networks:
      - opencitadel-network
      - opencitadel-sandbox-network
    ports:
      - "${OPS_CONSOLE_PORT:-9099}:9099"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:9099/health')"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

  # Deterministic OpenAI-compatible fixture for the acceptance profile only.
  # It is registered through the public inference control plane and is never
  # part of the production image or deployment surface.
  acceptance-inference:
    labels: *ownership-labels
    profiles:
      - acceptance
    build:
      context: ./e2e/fixtures/inference-provider
      dockerfile: Dockerfile
      args:
        <<: *pip-build-args
    image: opencitadel-acceptance-inference
    restart: "no"
    read_only: true
    user: "1000:1000"
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 64
    mem_limit: 128m
    cpus: "0.25"
    environment:
      ACCEPTANCE_PROVIDER_TOKEN: ${ACCEPTANCE_PROVIDER_TOKEN:-}
    tmpfs:
      - /tmp:rw,nosuid,nodev,noexec,size=16m,mode=1777
    networks:
      - opencitadel-network
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/healthz"]
      interval: 5s
      timeout: 3s
      retries: 12

  # ==================== Nginx 网关 ====================

  opencitadel-nginx:
    labels: *ownership-labels
    security_opt:
      - no-new-privileges:true
    image: nginx:alpine
    restart: unless-stopped
    mem_limit: 128m
    mem_reservation: 64m
    cpus: "0.50"
    environment:
      OPENCITADEL_DOMAIN: ${OPENCITADEL_DOMAIN:-}
      HTTPS_ENABLED: ${HTTPS_ENABLED:-false}
    ports:
      - "${NGINX_PORT:-8088}:80"
      - "${NGINX_HTTPS_PORT:-443}:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      # Mounted outside the image's default /etc/nginx/templates so the stock
      # 20-envsubst-on-templates.sh entrypoint script (which blindly envsubst's
      # every *.template file it finds there) does not also render these -
      # it substitutes ALL env vars including an empty OPENCITADEL_DOMAIN,
      # producing an invalid `server_name ;` directive and a broken
      # default.https.conf with unresolved cert paths. Our own
      # 40-generate-config.sh reads from here instead and is the only
      # renderer for these templates.
      - ./nginx/templates:/etc/nginx/templates-src:ro
      - ./nginx/generate-config.sh:/docker-entrypoint.d/40-generate-config.sh:ro
      - nginx_conf:/etc/nginx/conf.d
      - /etc/letsencrypt:/etc/letsencrypt:ro
    depends_on:
      opencitadel-ui:
        condition: service_healthy
      opencitadel-api:
        condition: service_healthy
    networks:
      - opencitadel-network
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/"]
      interval: 30s
      timeout: 5s
      retries: 3

# ==================== 数据卷 ====================
volumes:
  redis_data:
    labels: *ownership-labels
    driver: local
  postgres_data:
    labels: *ownership-labels
    driver: local
  minio_data:
    labels: *ownership-labels
    driver: local
  nginx_conf:
    labels: *ownership-labels
    driver: local

# ==================== 网络 ====================
networks:
  opencitadel-network:
    labels: *ownership-labels
    driver: bridge
  # Dedicated segment for the write-scoped Ops Actuator / read-only Ops
  # Collector MCP surfaces. Only api and execution-kernel join it, so no
  # unrelated container can dial these servers over the shared network.
  opencitadel-ops-network:
    labels: *ownership-labels
    driver: bridge
  opencitadel-sandbox-network:
    labels: *ownership-labels
    driver: bridge
    internal: true
  opencitadel-egress-network:
    labels: *ownership-labels
    driver: bridge
