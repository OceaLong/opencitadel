name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  api-test:
    name: API tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: opencitadel
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d opencitadel"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      ENV: test
      POSTGRES_HOST: localhost
      POSTGRES_USER: opencitadel_app
      POSTGRES_PASSWORD: ci-postgres-app-password
      POSTGRES_DB: opencitadel
      REDIS_HOST: localhost
      REDIS_PORT: 6379
      REDIS_DB: 0
      API_KEY_SECRET: b153c2ae8da399ae6a90a2c20bb61f0eee23530a960c2c3630c66354afced9df
      JWT_SECRET: ci-jwt-secret-with-at-least-32-chars!!
      SESSION_SECRET: ci-session-secret-32-chars-min!!
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Install uv
        run: pip install uv==0.11.19
      - name: Install dependencies
        run: uv sync --frozen
      - name: Prepare non-superuser application database role
        env:
          POSTGRES_ADMIN_PASSWORD: postgres
          POSTGRES_APP_USER: opencitadel_app
          POSTGRES_APP_PASSWORD: ci-postgres-app-password
        run: uv run python scripts/prepare_ci_database.py
      - name: Run database migrations
        run: uv run python -m app.migrate
      - name: Run pytest
        run: uv run pytest

  ui-test:
    name: UI tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - run: npm ci
      - run: npm run i18n:check
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test
      - run: npm run build
        env:
          NEXT_PUBLIC_API_BASE_URL: /api

  docker-build:
    name: Docker build (${{ matrix.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: api
            context: api
            file: api/Dockerfile
            target: api
          - name: worker
            context: api
            file: api/Dockerfile
            target: worker
          - name: migrate
            context: api
            file: api/Dockerfile
            target: api
          - name: ui
            context: ui
            file: ui/Dockerfile
            target: runner
          - name: sandbox
            context: sandbox
            file: sandbox/Dockerfile
            target: ""
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          target: ${{ matrix.target || '' }}
          push: false
          load: true
          tags: opencitadel-${{ matrix.name }}:ci
          build-args: |
            PIP_INDEX_URL=https://pypi.org/simple/
            UV_INDEX_URL=https://pypi.org/simple/
            NPM_CONFIG_REGISTRY=https://registry.npmjs.org
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
      - name: Scan built image
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        with:
          image-ref: opencitadel-${{ matrix.name }}:ci
          severity: HIGH,CRITICAL
          ignore-unfixed: false
          exit-code: "1"
          format: table

  sandbox-test:
    name: Sandbox tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sandbox
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Install uv
        run: pip install uv==0.11.19
      - name: Run sandbox tests from the locked environment
        run: uv run --frozen --with pytest==8.4.2 pytest

  deployment-render:
    name: Deployment render
    runs-on: ubuntu-latest
    env:
      OPENCITADEL_ENV_FILE: .env.example
      SANDBOX_BROKER_TOKEN: ci-sandbox-broker-token-at-least-32-characters
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: azure/setup-helm@bf6a7d304bc2fdb57e0331155b7ebf2c504acf0a # v4
      - name: Validate Docker Compose
        run: docker compose --env-file .env.example config --quiet
      - name: Validate sandbox egress proxy policy
        run: >-
          docker run --rm
          --entrypoint squid
          -v "${{ github.workspace }}/deploy/squid/squid.conf:/etc/squid/squid.conf:ro"
          ubuntu/squid:6.6-24.04_edge
          -k parse -f /etc/squid/squid.conf
      - name: Lint Helm chart
        run: >-
          helm lint deploy/helm/opencitadel
          --set secrets.apiKeySecret=ci-api-key-secret-aaaaaaaaaaaaaaaa
          --set secrets.auditSigningKey=ci-audit-key-bbbbbbbbbbbbbbbbbbbb
          --set secrets.jwtSecret=ci-jwt-secret-cccccccccccccccccccc
          --set secrets.sessionSecret=ci-session-secret-ddddddddddddddddd
          --set secrets.bootstrapAdminPassword=ci-admin-password-strong
          --set secrets.postgresAdminPassword=ci-postgres-admin-password
          --set secrets.postgresPassword=ci-postgres-password-strong
          --set secrets.redisPassword=ci-redis-password-strong
      - name: Render Helm manifests
        run: >-
          helm template opencitadel deploy/helm/opencitadel
          --set secrets.apiKeySecret=ci-api-key-secret-aaaaaaaaaaaaaaaa
          --set secrets.auditSigningKey=ci-audit-key-bbbbbbbbbbbbbbbbbbbb
          --set secrets.jwtSecret=ci-jwt-secret-cccccccccccccccccccc
          --set secrets.sessionSecret=ci-session-secret-ddddddddddddddddd
          --set secrets.bootstrapAdminPassword=ci-admin-password-strong
          --set secrets.postgresAdminPassword=ci-postgres-admin-password
          --set secrets.postgresPassword=ci-postgres-password-strong
          --set secrets.redisPassword=ci-redis-password-strong
          > /dev/null

  docs-check:
    name: Documentation checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Run documentation consistency script
        run: ./scripts/check-docs.sh
