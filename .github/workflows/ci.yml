name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  UV_VERSION: "0.11.33"

jobs:
  api-test:
    name: Kernel and API
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: opencitadel
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d opencitadel"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      ENV: test
      SQLALCHEMY_DATABASE_URI: postgresql+asyncpg://postgres:postgres@localhost:5432/opencitadel
      SQLALCHEMY_MIGRATION_DATABASE_URI: postgresql+psycopg2://postgres:postgres@localhost:5432/opencitadel
      KERNEL_V2_TEST_DATABASE_URI: postgresql+asyncpg://postgres:postgres@localhost:5432/opencitadel
      JWT_SECRET: kernel-v2-test-signing-secret
      SESSION_SECRET: kernel-v2-test-signing-secret
      DATABASE_AUTHORIZATION_SIGNING_SECRET: kernel-v2-test-signing-secret
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: pip install "uv==${UV_VERSION}"
      - run: uv sync --frozen --all-groups
      - name: Lint and architecture boundaries
        run: |
          uv run ruff check --config ../ruff.toml app core tests
          uv run ruff format --config ../ruff.toml --check app core tests
          uv run lint-imports
      - name: Prove destructive migration from an empty database
        run: uv run alembic upgrade head
      - name: Run focused v2 suite
        run: uv run pytest -q tests/app
      - name: Run configuration suite without database overrides
        env:
          SQLALCHEMY_DATABASE_URI: ""
          SQLALCHEMY_MIGRATION_DATABASE_URI: ""
          KERNEL_V2_TEST_DATABASE_URI: ""
        run: uv run pytest -q tests/core

  ui-test:
    name: Core UI
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
        env:
          NEXT_PUBLIC_API_BASE_URL: /api

  sandbox-test:
    name: Sandbox
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sandbox
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: pip install "uv==${UV_VERSION}"
      - run: uv sync --frozen
      - run: uv run pytest -q

  deployment-render:
    name: Deployment contracts
    runs-on: ubuntu-latest
    env:
      OPENCITADEL_ENV_FILE: .env.example
      SANDBOX_BROKER_TOKEN: ci-sandbox-broker-token-at-least-32-characters
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
      - run: docker compose --env-file .env.example config --quiet
      - name: Lint and render Helm
        run: |
          helm lint deploy/helm/opencitadel --set-json secrets='{"apiKeySecret":"ci-api-key-secret-aaaaaaaaaaaaaaaa","auditSigningKey":"ci-audit-key-bbbbbbbbbbbbbbbbbbbb","jwtSecret":"ci-jwt-secret-cccccccccccccccccccc","sessionSecret":"ci-session-secret-ddddddddddddddddd","bootstrapAdminPassword":"ci-admin-password-strong","postgresAdminPassword":"ci-postgres-admin-password","postgresMigrationPassword":"ci-postgres-migration-password","postgresPassword":"ci-postgres-password-strong","executionKernelPostgresPassword":"ci-kernel-postgres-password","redisPassword":"ci-redis-password-strong"}'
          helm template opencitadel deploy/helm/opencitadel --set-json secrets='{"apiKeySecret":"ci-api-key-secret-aaaaaaaaaaaaaaaa","auditSigningKey":"ci-audit-key-bbbbbbbbbbbbbbbbbbbb","jwtSecret":"ci-jwt-secret-cccccccccccccccccccc","sessionSecret":"ci-session-secret-ddddddddddddddddd","bootstrapAdminPassword":"ci-admin-password-strong","postgresAdminPassword":"ci-postgres-admin-password","postgresMigrationPassword":"ci-postgres-migration-password","postgresPassword":"ci-postgres-password-strong","executionKernelPostgresPassword":"ci-kernel-postgres-password","redisPassword":"ci-redis-password-strong"}' > /dev/null

  docker-build:
    name: Image (${{ matrix.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - {name: api, context: api, file: api/Dockerfile, target: api}
          - {name: execution-kernel, context: api, file: api/Dockerfile, target: execution-kernel}
          - {name: migrate, context: api, file: api/Dockerfile, target: api}
          - {name: ui, context: ui, file: ui/Dockerfile, target: runner}
          - {name: sandbox, context: sandbox, file: sandbox/Dockerfile, target: ""}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          target: ${{ matrix.target }}
          push: false
          tags: opencitadel-${{ matrix.name }}:ci
