name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  patrol-collector-test:
    name: Ops Collector tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ops-collector
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install uv
        run: pip install uv==0.11.19
      - name: Install locked dependencies
        run: uv sync --frozen
      - name: Run unit, contract, and fixture-structure tests
        run: uv run pytest -q

  ops-actuator-test:
    name: Ops Actuator tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ops-actuator
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install uv
        run: pip install uv==0.11.19
      - name: Install locked dependencies
        run: uv sync --frozen
      - name: Run unit, contract, and fixture-structure tests
        run: uv run pytest -q

  api-test:
    name: API tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: opencitadel
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d opencitadel"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      ENV: test
      POSTGRES_HOST: localhost
      POSTGRES_USER: opencitadel_app
      POSTGRES_PASSWORD: ci-postgres-app-password
      POSTGRES_DB: opencitadel
      REDIS_HOST: localhost
      REDIS_PORT: 6379
      REDIS_DB: 0
      API_KEY_SECRET: b153c2ae8da399ae6a90a2c20bb61f0eee23530a960c2c3630c66354afced9df # gitleaks:allow
      JWT_SECRET: ci-jwt-secret-with-at-least-32-chars!!
      SESSION_SECRET: ci-session-secret-32-chars-min!!
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install uv
        run: pip install uv==0.11.19
      - name: Install dependencies
        run: uv sync --frozen --all-groups
      - name: Import contracts (lint-imports)
        run: uv run lint-imports
      - name: Prepare non-superuser application database role
        env:
          POSTGRES_ADMIN_PASSWORD: postgres
          POSTGRES_APP_USER: opencitadel_app
          POSTGRES_APP_PASSWORD: ci-postgres-app-password
        run: uv run python scripts/prepare_ci_database.py
      - name: Run database migrations
        run: uv run python -m app.migrate
      - name: Run pytest
        run: uv run pytest

  ui-test:
    name: UI tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - run: npm ci
      - run: npm run i18n:check
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test
      - run: npm run build
        env:
          NEXT_PUBLIC_API_BASE_URL: /api

  docker-build:
    name: Docker build (${{ matrix.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ github.event_name == 'pull_request' && fromJSON('{"include":[{"name":"api","context":"api","file":"api/Dockerfile","target":"api"},{"name":"worker","context":"api","file":"api/Dockerfile","target":"worker"},{"name":"migrate","context":"api","file":"api/Dockerfile","target":"api"},{"name":"ui","context":"ui","file":"ui/Dockerfile","target":"runner"},{"name":"sandbox","context":"sandbox","file":"sandbox/Dockerfile","target":""},{"name":"ops-collector","context":"ops-collector","file":"ops-collector/Dockerfile","target":""},{"name":"ops-actuator","context":"ops-actuator","file":"ops-actuator/Dockerfile","target":""}]}') || fromJSON('{"include":[{"name":"sandbox","context":"sandbox","file":"sandbox/Dockerfile","target":""},{"name":"ops-collector","context":"ops-collector","file":"ops-collector/Dockerfile","target":""},{"name":"ops-actuator","context":"ops-actuator","file":"ops-actuator/Dockerfile","target":""}]}') }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
      - uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          target: ${{ matrix.target || '' }}
          push: false
          load: true
          tags: opencitadel-${{ matrix.name }}:ci
          build-args: |
            PIP_INDEX_URL=https://pypi.org/simple/
            UV_INDEX_URL=https://pypi.org/simple/
            NPM_CONFIG_REGISTRY=https://registry.npmjs.org
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

  sandbox-test:
    name: Sandbox tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sandbox
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install uv
        run: pip install uv==0.11.19
      - name: Run sandbox tests from the locked environment
        run: uv run --frozen --with pytest==8.4.2 --with pytest-asyncio==0.24.0 pytest

  deployment-render:
    name: Deployment render
    runs-on: ubuntu-latest
    env:
      OPENCITADEL_ENV_FILE: .env.example
      SANDBOX_BROKER_TOKEN: ci-sandbox-broker-token-at-least-32-characters
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
      - name: Validate Docker Compose
        run: docker compose --env-file .env.example config --quiet
      - name: Validate sandbox egress proxy policy
        run: >-
          docker run --rm
          --entrypoint squid
          -v "${{ github.workspace }}/deploy/squid/squid.conf:/etc/squid/squid.conf:ro"
          ubuntu/squid:6.6-24.04_edge
          -k parse -f /etc/squid/squid.conf
      - name: Lint Helm chart
        run: >-
          helm lint deploy/helm/opencitadel
          --set secrets.apiKeySecret=ci-api-key-secret-aaaaaaaaaaaaaaaa
          --set secrets.auditSigningKey=ci-audit-key-bbbbbbbbbbbbbbbbbbbb
          --set secrets.jwtSecret=ci-jwt-secret-cccccccccccccccccccc
          --set secrets.sessionSecret=ci-session-secret-ddddddddddddddddd
          --set secrets.bootstrapAdminPassword=ci-admin-password-strong
          --set secrets.postgresAdminPassword=ci-postgres-admin-password
          --set secrets.postgresPassword=ci-postgres-password-strong
          --set secrets.redisPassword=ci-redis-password-strong
      - name: Render Helm manifests
        run: >-
          helm template opencitadel deploy/helm/opencitadel
          --set secrets.apiKeySecret=ci-api-key-secret-aaaaaaaaaaaaaaaa
          --set secrets.auditSigningKey=ci-audit-key-bbbbbbbbbbbbbbbbbbbb
          --set secrets.jwtSecret=ci-jwt-secret-cccccccccccccccccccc
          --set secrets.sessionSecret=ci-session-secret-ddddddddddddddddd
          --set secrets.bootstrapAdminPassword=ci-admin-password-strong
          --set secrets.postgresAdminPassword=ci-postgres-admin-password
          --set secrets.postgresPassword=ci-postgres-password-strong
          --set secrets.redisPassword=ci-redis-password-strong
          > /dev/null
      - name: Render least-privilege Ops Collector manifests
        run: |
          helm template opencitadel deploy/helm/opencitadel \
            --set opsCollector.enabled=true \
            --set secrets.apiKeySecret=ci-api-key-secret-aaaaaaaaaaaaaaaa \
            --set secrets.auditSigningKey=ci-audit-key-bbbbbbbbbbbbbbbbbbbb \
            --set secrets.jwtSecret=ci-jwt-secret-cccccccccccccccccccc \
            --set secrets.sessionSecret=ci-session-secret-ddddddddddddddddd \
            --set secrets.bootstrapAdminPassword=ci-admin-password-strong \
            --set secrets.postgresAdminPassword=ci-postgres-admin-password \
            --set secrets.postgresPassword=ci-postgres-password-strong \
            --set secrets.redisPassword=ci-redis-password-strong > /dev/null
          kubectl kustomize deploy/kustomize/ops-collector > /dev/null
      - name: Render least-privilege Ops Actuator manifests
        run: |
          helm template opencitadel deploy/helm/opencitadel \
            --set opsActuator.enabled=true \
            --set secrets.apiKeySecret=ci-api-key-secret-aaaaaaaaaaaaaaaa \
            --set secrets.auditSigningKey=ci-audit-key-bbbbbbbbbbbbbbbbbbbb \
            --set secrets.jwtSecret=ci-jwt-secret-cccccccccccccccccccc \
            --set secrets.sessionSecret=ci-session-secret-ddddddddddddddddd \
            --set secrets.bootstrapAdminPassword=ci-admin-password-strong \
            --set secrets.postgresAdminPassword=ci-postgres-admin-password \
            --set secrets.postgresPassword=ci-postgres-password-strong \
            --set secrets.redisPassword=ci-redis-password-strong > /dev/null
          kubectl kustomize deploy/kustomize/ops-actuator > /dev/null

  patrol-kind-fixtures:
    # 20 read-only golden cases replayed against a disposable kind cluster,
    # plus fixture 21 (ops-actuator remediation: fail -> restart -> idempotent
    # replay -> heal -> recheck pass, driven by
    # scripts/drive_remediation_fixture.py). Docker is preinstalled on
    # ubuntu-latest runners, so `docker build` for the ops-actuator image
    # (built and `kind load`-ed by run-patrol-fixtures.sh itself, mirroring
    # the nginx/busybox/python fixture images) needs no extra buildx setup.
    name: Ops Patrol disposable-cluster fixtures (20 read-only + fixture 21 remediation)
    runs-on: ubuntu-latest
    # Bumped from 25 -> 30: fixture 21 (ops-actuator remediation) added a
    # Docker build + kind-load of the ops-actuator image plus the extra
    # fail -> restart -> idempotent-replay -> heal -> recheck drive on top
    # of the original 20 read-only cases. Revisit after the first few real
    # CI runs show a stable observed duration.
    timeout-minutes: 30
    needs: [patrol-collector-test, api-test]
    env:
      PATROL_RUN_REMEDIATION_FIXTURE: "true"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install uv and kind
        run: |
          pip install uv==0.11.19
          go install sigs.k8s.io/kind@v0.31.0
      - name: Install locked test environments
        run: |
          (cd ops-collector && uv sync --frozen)
          (cd api && uv sync --frozen --all-groups)
      - name: Run guarded fixture score (20 read-only cases + fixture 21 remediation)
        run: ./scripts/run-patrol-fixtures.sh
      - name: Upload fixture score
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: patrol-fixture-score
          path: tmp/patrol-fixture-score.json
          if-no-files-found: error

  docs-check:
    name: Documentation checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install ripgrep
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ripgrep
      - name: Run documentation consistency script
        run: ./scripts/check-docs.sh

  e2e-test:
    name: E2E smoke tests
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      OPENCITADEL_ENV_FILE: .env.e2e
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: e2e/package-lock.json
      - name: Resolve docker socket gid
        run: echo "DOCKER_SOCK_GID=$(stat -c '%g' /var/run/docker.sock)" >> "$GITHUB_ENV"
      - name: Generate e2e admin password
        run: |
          password=$(openssl rand -hex 10)
          echo "::add-mask::${password}"
          sed -i "s/^BOOTSTRAP_ADMIN_PASSWORD=.*/BOOTSTRAP_ADMIN_PASSWORD=${password}/" .env.e2e
          echo "PATROL_E2E_PASSWORD=${password}" >> "$GITHUB_ENV"
      - name: Start platform and demo stack
        run: >-
          docker compose --env-file .env.e2e
          --profile local --profile demo --profile patrol up -d --build
        env:
          PIP_INDEX_URL: https://pypi.org/simple/
          UV_INDEX_URL: https://pypi.org/simple/
          NPM_CONFIG_REGISTRY: https://registry.npmjs.org
      - name: Wait for services to become healthy
        run: |
          for i in $(seq 1 60); do
            unhealthy=$(docker compose --env-file .env.e2e --profile local --profile demo --profile patrol ps --format json \
              | python3 -c "import json,sys; rows=[json.loads(l) for l in sys.stdin if l.strip()]; print(sum(1 for r in rows if r.get('Health') not in ('healthy','') or r.get('State')!='running'))")
            [ "$unhealthy" = "0" ] && exit 0
            sleep 10
          done
          docker compose --env-file .env.e2e --profile local --profile demo --profile patrol ps
          docker compose --env-file .env.e2e --profile local --profile demo --profile patrol logs --tail 100
          exit 1
      - name: Install e2e dependencies
        working-directory: e2e
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Run Playwright smoke tests
        working-directory: e2e
        run: npm test
        env:
          # PATROL_E2E stays gated behind vars.PATROL_E2E_ENABLED rather than
          # being unconditionally on: patrol.spec needs a tool-capable LLM
          # behind Worker/Collector, which CI does not have, so enabling it
          # here would always fail. Enable only in protected environments
          # that have a real model configured.
          PATROL_E2E: ${{ vars.PATROL_E2E_ENABLED }}
          PATROL_E2E_PASSWORD: ${{ env.PATROL_E2E_PASSWORD }}
      - name: Upload playwright traces on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-results
          path: e2e/test-results/
          if-no-files-found: ignore
      - name: Tear down stack
        if: always()
        run: docker compose --env-file .env.e2e --profile local --profile demo --profile patrol down -v
