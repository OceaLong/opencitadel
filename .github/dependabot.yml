version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns: ["*"]
  - package-ecosystem: uv
    directory: /api
    schedule:
      interval: weekly
    groups:
      python-security:
        patterns: ["*"]
  - package-ecosystem: uv
    directory: /sandbox
    schedule:
      interval: weekly
    groups:
      python-security:
        patterns: ["*"]
  - package-ecosystem: uv
    directory: /ops-collector
    schedule:
      interval: weekly
    groups:
      python-security:
        patterns: ["*"]
  - package-ecosystem: uv
    directory: /ops-actuator
    schedule:
      interval: weekly
    groups:
      python-security:
        patterns: ["*"]
  # demo/ops-console pins deps in requirements.txt (no uv.lock), so it uses the
  # pip ecosystem rather than uv.
  - package-ecosystem: pip
    directory: /demo/ops-console
    schedule:
      interval: weekly
    groups:
      python-security:
        patterns: ["*"]
  - package-ecosystem: npm
    directory: /ui
    schedule:
      interval: weekly
    groups:
      ui-security:
        patterns: ["*"]
  - package-ecosystem: npm
    directory: /e2e
    schedule:
      interval: weekly
    groups:
      ui-security:
        patterns: ["*"]
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
